# Phase 6 W1 (Weisung P6-2, Plan Phase 6 VE1-VE4): Release aus einem Commit auf main.
# Startet NUR von Hand (workflow_dispatch), nie bei einem Push. Wer startet: nur Nico (oder Chat mit
# Nicos schriftlichem OK); CC startet diesen Ablauf nie.
#   art = entwurf (Vorgabe): baut alle Dateien (Windows, Linux, macOS, Android mit Release-Schluessel),
#         prueft T1-T3 und die Lizenzliste und legt einen ENTWURF an (nur fuer Nico sichtbar, kein Tag).
#         Hoechstens ein Entwurf: ein erneuter Lauf ersetzt dessen Dateien und Text. Liegen im Entwurf
#         Dateien, die der neue Bau nicht hat, bricht der Ablauf ab (Loeschen macht nur Nico).
#   art = veroeffentlichen: baut nichts neu. Prueft, dass der Entwurf zu diesem Commit gehoert und seine
#         Dateien genau der Pruefsummen-Tabelle im Text entsprechen, und veroeffentlicht ihn als normales
#         Release (Entscheidung 3a); erst dabei legt GitHub den Tag auf diesen Commit an.
# Abbruch (vor jedem Hochladen; Entwurfsregeln in werkzeuge/release/pruefe_entwuerfe.sh): nicht von refs/heads/main gestartet; Version ergibt keinen gueltigen Tag
# (T1, Sammelliste 73); kein erfolgreicher voller CI-Lauf 8/8 (workflow_dispatch, Stufe voll) auf genau
# diesem Commit; Tag oder veroeffentlichtes Release gibt es schon (vor dem Veroeffentlichen noch einmal geprueft,
# danach muss der neue Tag auf genau diesen Commit zeigen, werkzeuge/release/pruefe_tag.sh); mehr als ein Entwurf oder ein Entwurf mit
# anderem Tag; Android ohne Release-Schluessel oder mit anderem Fingerabdruck als
# werkzeuge/release/android_fingerabdruck.txt (T3).
# Geheimnisse (traegt nur Nico ein): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD. Sie stehen nur im Android-Job und nie in einer Ausgabe.
# Rechte: alles nur lesen; nur der Job, der den Entwurf anlegt oder veroeffentlicht, hat contents: write.
# Keine fremden Actions (nur actions/*); hochgeladen wird mit gh (auf dem Runner vorhanden).
name: Release

on:
  workflow_dispatch:
    inputs:
      art:
        description: "entwurf (bauen, Entwurf anlegen) oder veroeffentlichen (vorhandenen Entwurf veroeffentlichen)"
        type: choice
        options: [entwurf, veroeffentlichen]
        default: entwurf

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

# bash ueberall (auch Windows), mit pipefail: ein Fehler vor einem | geht nie unter
defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  pruefen:
    name: pruefen (main, 8/8, Tag, Entwurf)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      anzeige: ${{ steps.version.outputs.anzeige }}
    steps:
      - name: Nur von main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "FEHLER: Release nur von refs/heads/main (gestartet von $GITHUB_REF)"; exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version und Tag (T1)
        id: version
        run: |
          python -I werkzeuge/release/release.py selbsttest
          python -I werkzeuge/release/release.py version | tee kennzahlen.txt
          echo "tag=$(grep -m1 '^TAG=' kennzahlen.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          echo "anzeige=$(grep -m1 '^ANZEIGE=' kennzahlen.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - name: Voller CI-Lauf 8/8 auf diesem Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          soll='android (APK, nur arm64-v8a, Testsignatur)
          pakete (linux-x64)
          pakete (osx-arm64)
          pakete (win-x64)
          tests (macos-15)
          tests (ubuntu-latest)
          tests (windows-latest)
          vergleichswerte (Python 3.12)'
          soll="$(echo "$soll" | sed 's/^ *//' | sort)"
          gefunden=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&status=success&per_page=50" --jq '.workflow_runs[].id'); do
            ist="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "success") | .name' | sort)"
            if [ "$ist" = "$soll" ]; then echo "voller Lauf $id: 8/8 gruen"; gefunden=1; break; fi
            echo "Lauf $id ist nicht 8/8 gruen:"; echo "$ist"
          done
          if [ "$gefunden" != 1 ]; then echo "FEHLER: kein voller Lauf 8/8 (Dispatch, Stufe voll) auf $GITHUB_SHA"; exit 1; fi
      - name: Tag gibt es noch nicht
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: bash werkzeuge/release/pruefe_tag.sh fehlt "$TAG"
      # Entwuerfe sieht nur ein Token mit Schreibrecht: diese Regeln prueft werkzeuge/release/pruefe_entwuerfe.sh
      # in den Jobs entwurf und veroeffentlichen vor jedem Hochladen.

  bauen:
    name: bauen (${{ matrix.rid }})
    needs: pruefen
    if: inputs.art == 'entwurf'
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Werkzeuge
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y -q squashfs-tools; fi
      - name: Release-Dateien bauen
        shell: bash
        env:
          PYTHON: python
        run: bash werkzeuge/release/baue_release.sh ${{ matrix.rid }} release
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: release/release-${{ matrix.rid }}/
          if-no-files-found: error

  android:
    name: android (Release-Schluessel)
    needs: pruefen
    if: inputs.art == 'entwurf'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Android-Workload
        run: dotnet workload install android
      - name: Schluesseldatei aus dem Geheimnis
        env:
          SCHLUESSEL_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SCHLUESSEL_BASE64" ]; then echo "FEHLER: Geheimnis ANDROID_KEYSTORE_BASE64 fehlt"; exit 1; fi
          umask 077
          printf '%s' "$SCHLUESSEL_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Release-APK bauen und Fingerabdruck pruefen (T3)
        env:
          PYTHON: python
          LERNPLATTFORM_RELEASE_STRENG: "1"
          LERNPLATTFORM_SCHLUESSEL_DATEI: ${{ runner.temp }}/release.keystore
          LERNPLATTFORM_SCHLUESSEL_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LERNPLATTFORM_SCHLUESSEL_PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LERNPLATTFORM_SCHLUESSEL_KEY_PASSWORT: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash werkzeuge/release/baue_release.sh android release
      - name: Schluesseldatei loeschen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release/release-android/
          if-no-files-found: error

  entwurf:
    name: Entwurf anlegen oder ersetzen
    needs: [pruefen, bauen, android]
    if: inputs.art == 'entwurf'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # nur die vier Bauteile (release-<rid> und release-android), nie ein altes release-entwurf
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*-*
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-android
          path: release/release-android
      - name: Zusammenstellen und pruefen (T2, Lizenzliste)
        run: python -I werkzeuge/release/release.py zusammen release release/entwurf
      - name: Entwuerfe pruefen (hoechstens einer, gleicher Tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash werkzeuge/release/pruefe_entwuerfe.sh entwurf "${{ needs.pruefen.outputs.tag }}" "$GITHUB_SHA"
      - name: Entwurf anlegen oder ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pruefen.outputs.tag }}
          TITEL: Fachinformatiker Lernplattform ${{ needs.pruefen.outputs.anzeige }}
        run: |
          id="$(cat entwurf_id.txt)"
          if [ -z "$id" ]; then
            gh release create "$TAG" release/entwurf/* --draft --target "$GITHUB_SHA" --title "$TITEL" --notes-file release/release.md
          else
            # Dateien im Entwurf, die der neue Bau nicht hat: Abbruch statt Loeschen (Loeschen macht nur Nico)
            gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --paginate --jq '.[].name' | sort > alt.txt
            ls release/entwurf | sort > neu.txt
            if comm -23 alt.txt neu.txt | grep .; then echo "FEHLER: diese Dateien im Entwurf hat der neue Bau nicht"; exit 1; fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f target_commitish="$GITHUB_SHA" -f name="$TITEL" -F body=@release/release.md >/dev/null
            gh release upload "$TAG" release/entwurf/* --clobber
          fi
      - name: Hochgeladene Dateien pruefen (Digest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash werkzeuge/release/pruefe_entwuerfe.sh entwurf "${{ needs.pruefen.outputs.tag }}" "$GITHUB_SHA"
          id="$(cat entwurf_id.txt)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --paginate --slurp > seiten.json
          python -I -c "import json; json.dump([a for s in json.load(open('seiten.json')) for a in s], open('assets.json', 'w'))"
          python -I werkzeuge/release/release.py digest release/entwurf assets.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-entwurf
          path: |
            release/entwurf/
            release/release.md

  veroeffentlichen:
    name: Entwurf veroeffentlichen
    needs: pruefen
    if: inputs.art == 'veroeffentlichen'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Entwurf pruefen (gleicher Commit, Dateien gleich der Pruefsummen-Tabelle)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash werkzeuge/release/pruefe_entwuerfe.sh veroeffentlichen "${{ needs.pruefen.outputs.tag }}" "$GITHUB_SHA"
          id="$(cat entwurf_id.txt)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '.body' > release.md
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --paginate --slurp > seiten.json
          python -I -c "import json; json.dump([a for s in json.load(open('seiten.json')) for a in s], open('assets.json', 'w'))"
          python -I werkzeuge/release/release.py digest-text assets.json release.md
          echo "ID=$id" >> "$GITHUB_ENV"
      - name: Veroeffentlichen (normales Release, Entscheidung 3a)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pruefen.outputs.tag }}
        run: |
          # unmittelbar davor: den Tag gibt es noch nicht (sonst naehme GitHub einen fremden Tag)
          bash werkzeuge/release/pruefe_tag.sh fehlt "$TAG"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -F prerelease=false -f make_latest=true -f target_commitish="$GITHUB_SHA" >/dev/null
      - name: Tag zeigt auf diesen Commit
        env:
          TAG: ${{ needs.pruefen.outputs.tag }}
        run: bash werkzeuge/release/pruefe_tag.sh zeigt-auf "$TAG" "$GITHUB_SHA"
