# Welle A 0.89.0 (Inhaltspakete W3, Weisung P12-297 W3-3, Plan P12-175 Abschnitt 4): Release eines Inhaltspakets aus
# pakete/<kennung>/ (eigene Linie, Tag vP<kennung>.<stand>, Datei <kennung>_<stand>.fipaket, gebaut mit
# werkzeuge/pakete/paket_bauen.py ordner). Startet NUR von Hand (workflow_dispatch) und nur durch Chat mit Nicos Wort;
# CC startet diesen Ablauf nie. Kein Paket-Release ohne Nicos Wort.
#   art = entwurf (Vorgabe): baut das Paket, prueft es und legt einen ENTWURF an (kein Tag). Die App sieht Entwuerfe nie.
#         Hoechstens ein Paket-Entwurf (Entwuerfe der Lernplattform und des Werkzeugs zaehlen getrennt).
#   art = veroeffentlichen: baut nichts neu, prueft den Entwurf gegen die Pruefsummen-Tabelle und veroeffentlicht ihn
#         als normales Release, NIE als "latest" und nie als Vorab-Release: "latest" bleibt immer die Lernplattform.
#         Die Update-Suche der Programme nimmt nie vP (Core/Update/ReleaseLinie.cs, Tests mit Gegenprobe); die App
#         liest Pakete nur aus vP-Releases ohne Entwurf und Vorab und prueft die Datei gegen den digest von GitHub.
# Abbruch vor jedem Hochladen: nicht von main; Kennung ungueltig oder ohne Ordner; Quelle oder paket_bauen.py-Selbsttest
# rot; kein voller CI-Lauf 18/18 auf diesem Commit oder mit gleichem Tree; Tag oder veroeffentlichtes Release gibt es
# schon; mehr als ein Paket-Entwurf oder einer mit anderem Tag. Rechte nur lesen, nur Entwurf/Veroeffentlichen mit
# contents: write; keine Geheimnisse.
# Welle A 1.5.0 (Weisung P12-358, Sammelliste 386): die Fachrichtungs-Pakete lernen_ae, lernen_dpa, lernen_dv haben keinen
# Ordner unter pakete/; sie werden mit paket_release.py lernen-bauen aus inhalte_csharp/lernen/ geschnitten und muessen
# Byte fuer Byte gleich der echten Testdatei des Commits sein (Stand und braucht_app: paket_bauen.LERNEN_TESTDATEI).
# Reihenfolge nach dem Merge von A 1.5.0: zuerst diese drei Pakete veroeffentlichen, danach erst vA1.5.0 (release.yml
# prueft das und wird sonst rot).
name: Paket-Release

on:
  workflow_dispatch:
    inputs:
      kennung:
        description: "Kennung des Pakets (Ordner pakete/<kennung>, oder lernen_ae, lernen_dpa, lernen_dv)"
        type: string
        required: true
      art:
        description: "entwurf (bauen, Entwurf anlegen) oder veroeffentlichen (vorhandenen Entwurf veroeffentlichen)"
        type: choice
        options: [entwurf, veroeffentlichen]
        default: entwurf

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pruefen:
    name: pruefen (main, 18/18, Tag vP, Quelle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.kopf.outputs.tag }}
      datei: ${{ steps.kopf.outputs.datei }}
      name: ${{ steps.kopf.outputs.name }}
      lauf: ${{ steps.lauf.outputs.lauf }}
    steps:
      - name: Nur von main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "FEHLER: Release nur von refs/heads/main (gestartet von $GITHUB_REF)"; exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Die Kennung kommt als Umgebung (nie als Text im Skript) und muss dem Muster der App genuegen
      - name: Kennung, Quelle und Tag
        id: kopf
        env:
          KENNUNG: ${{ inputs.kennung }}
        run: |
          python -I -c "import os, re, sys; sys.exit(0 if re.fullmatch(r'[a-z][a-z0-9_]{1,31}', os.environ['KENNUNG']) else 'FEHLER: Kennung ungueltig')"
          python -I werkzeuge/pakete/paket_bauen.py selbsttest pakete
          python -I werkzeuge/pakete/paket_release.py selbsttest pakete
          case "$KENNUNG" in
            lernen_ae|lernen_dpa|lernen_dv) python -I werkzeuge/pakete/paket_release.py lernen-kopf "$KENNUNG" | tee kopf.txt ;;
            *)
              if [ ! -d "pakete/$KENNUNG" ]; then echo "FEHLER: kein Ordner pakete/$KENNUNG"; exit 1; fi
              python -I werkzeuge/pakete/paket_release.py kopf "pakete/$KENNUNG" | tee kopf.txt ;;
          esac
          tag="$(grep -m1 '^TAG=' kopf.txt | cut -d= -f2-)"
          case "$tag" in "vP$KENNUNG".*) ;; *) echo "FEHLER: Tag '$tag' ist kein Paket-Tag vP$KENNUNG.<stand>"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "datei=$(grep -m1 '^DATEI=' kopf.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -m1 '^NAME=' kopf.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      # Wie release.yml: das Paket wird von der App gelesen, darum gilt nur der volle Lauf 18/18 (kein Lauf werkzeug)
      - name: Voller CI-Lauf 18/18 auf diesem Commit oder mit gleichem Tree
        id: lauf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          soll='android (APK, nur arm64-v8a, Testsignatur)
          pakete (linux-x64)
          pakete (osx-arm64)
          pakete (osx-x64)
          pakete (stadtbau win-x64)
          pakete (win-x64)
          release (Entwuerfe zusammenstellen)
          tests (macos-15, Einzeltests und Lernteil)
          tests (macos-15, Spiel und Metal)
          tests (macos-15-intel, Einzeltests und Spiel)
          tests (macos-15-intel, Lernteil)
          tests (macos-15-intel, Metal)
          tests (ubuntu-latest)
          tests (windows-latest, Einzeltests)
          tests (windows-latest, Layout 100)
          tests (windows-latest, Layout 150)
          tests (windows-latest, Lernteil und Spiel)
          sollwerte (Pruefsummen)'
          soll="$(echo "$soll" | sed 's/^ *//' | sort)"
          export SOLL="$soll"
          export JOBFILTER='.jobs[] | select(.conclusion == "success" and .name != "urteil (GitHub oder echt)") | .name'
          python -I werkzeuge/release/lauf_waehlen.py selbsttest
          python -I werkzeuge/release/lauf_waehlen.py waehlen
      - name: Tag gibt es noch nicht
        env:
          TAG: ${{ steps.kopf.outputs.tag }}
        run: bash werkzeuge/release/pruefe_tag.sh fehlt "$TAG"

  entwurf:
    name: Entwurf anlegen oder ersetzen
    needs: pruefen
    if: inputs.art == 'entwurf'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Paket bauen und Release-Text schreiben
        env:
          KENNUNG: ${{ inputs.kennung }}
          DATEI: ${{ needs.pruefen.outputs.datei }}
          LAUF: ${{ needs.pruefen.outputs.lauf }}
        run: |
          mkdir -p paket/entwurf
          case "$KENNUNG" in
            lernen_ae|lernen_dpa|lernen_dv) gebaut="$(python -I werkzeuge/pakete/paket_release.py lernen-bauen "$KENNUNG" paket/entwurf)" ;;
            *) gebaut="$(python -I werkzeuge/pakete/paket_bauen.py ordner "pakete/$KENNUNG" paket/entwurf)" ;;
          esac
          if [ "$(basename "$gebaut")" != "$DATEI" ] || [ "$(ls paket/entwurf)" != "$DATEI" ]; then echo "FEHLER: gebaut $gebaut statt $DATEI"; exit 1; fi
          case "$KENNUNG" in
            lernen_ae|lernen_dpa|lernen_dv) python -I werkzeuge/pakete/paket_release.py lernen-text "$KENNUNG" "$gebaut" paket/release.md ;;
            *) python -I werkzeuge/pakete/paket_release.py text "pakete/$KENNUNG" "$gebaut" paket/release.md ;;
          esac
          if [ -z "$LAUF" ]; then echo "FEHLER: kein genommener CI-Lauf aus dem Job pruefen"; exit 1; fi
          python -I werkzeuge/release/lauf_waehlen.py text paket/release.md "$LAUF"
          cat paket/release.md
      - name: Entwuerfe pruefen (hoechstens ein Paket-Entwurf, gleicher Tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash werkzeuge/release/pruefe_entwuerfe.sh entwurf "${{ needs.pruefen.outputs.tag }}" "$GITHUB_SHA"
      - name: Entwurf anlegen oder ersetzen (nie latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pruefen.outputs.tag }}
          TITEL: ${{ needs.pruefen.outputs.name }}
        run: |
          id="$(cat entwurf_id.txt)"
          if [ -z "$id" ]; then
            gh release create "$TAG" paket/entwurf/* --draft --latest=false --target "$GITHUB_SHA" --title "$TITEL" --notes-file paket/release.md
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --paginate --jq '.[].name' | sort > alt.txt
            ls paket/entwurf | sort > neu.txt
            if comm -23 alt.txt neu.txt | grep .; then echo "FEHLER: diese Dateien im Entwurf hat der neue Bau nicht"; exit 1; fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f target_commitish="$GITHUB_SHA" -f name="$TITEL" -F body=@paket/release.md >/dev/null
            gh release upload "$TAG" paket/entwurf/* --clobber
          fi
      - name: Hochgeladene Datei pruefen (Digest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash werkzeuge/release/pruefe_entwuerfe.sh entwurf "${{ needs.pruefen.outputs.tag }}" "$GITHUB_SHA"
          id="$(cat entwurf_id.txt)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --paginate --slurp > seiten.json
          python -I -c "import json; json.dump([a for s in json.load(open('seiten.json')) for a in s], open('assets.json', 'w'))"
          python -I werkzeuge/release/release.py digest paket/entwurf assets.json
          python -I werkzeuge/release/release.py digest-text assets.json paket/release.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paket-release-entwurf
          path: |
            paket/entwurf/
            paket/release.md

  veroeffentlichen:
    name: Entwurf veroeffentlichen (nie latest, nie Vorab)
    needs: pruefen
    if: inputs.art == 'veroeffentlichen'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Entwurf pruefen (gleicher Commit, Datei gleich der Pruefsummen-Tabelle)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash werkzeuge/release/pruefe_entwuerfe.sh veroeffentlichen "${{ needs.pruefen.outputs.tag }}" "$GITHUB_SHA"
          id="$(cat entwurf_id.txt)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '.body' > release.md
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --paginate --slurp > seiten.json
          python -I -c "import json; json.dump([a for s in json.load(open('seiten.json')) for a in s], open('assets.json', 'w'))"
          python -I werkzeuge/release/release.py digest-text assets.json release.md
          echo "ID=$id" >> "$GITHUB_ENV"
      - name: Veroeffentlichen (normales Release, nie latest, nie Vorab)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pruefen.outputs.tag }}
        run: |
          bash werkzeuge/release/pruefe_tag.sh fehlt "$TAG"
          latest_vorher="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' || true)"
          echo "latest vorher: $latest_vorher"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -F prerelease=false -f make_latest=false -f target_commitish="$GITHUB_SHA" >/dev/null
          latest_nachher="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' || true)"
          echo "latest nachher: $latest_nachher"
          case "$latest_nachher" in vP*) echo "FEHLER: das Paket-Release ist latest (Nico und Chat melden, nichts loeschen)"; exit 1 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '[.draft, .prerelease] | @tsv' | tee zustand.txt
          if [ "$(cat zustand.txt)" != "$(printf 'false\tfalse')" ]; then echo "FEHLER: Release ist noch Entwurf oder Vorab (die App saehe es nicht)"; exit 1; fi
      - name: Tag zeigt auf diesen Commit
        env:
          TAG: ${{ needs.pruefen.outputs.tag }}
        run: bash werkzeuge/release/pruefe_tag.sh zeigt-auf "$TAG" "$GITHUB_SHA"
