# Phase 0: Bauen und Testen auf jedem Push und Pull Request.
# Nur Leserechte; kein Release, kein Tag, keine Zugangsdaten.
#
# Zwei Stufen (Weisung P4-12, Nico 22.10.2026):
# - schnell: sollwerte und tests (ubuntu-latest) mit Start-Test und Python-Pruefungen.
#   Laeuft bei jedem Push auf einen Pull Request und auf main.
# - voll: dazu tests (windows-latest x4, macos-15 x2, macos-15-intel x3), pakete x4 und android (16 Jobs;
#   bis A 0.38.0 10 Teile, Welle CI schneller Weisung P11-38: lange Jobs in parallele Teile).
#   Phase 11 FW10 (Weisung P11-18): macos-15-intel und pakete (osx-x64) fuer Intel-Macs. Laeuft nur
#   ueber workflow_dispatch (Vorgabe voll) oder bei einem Pull Request mit dem Label "voll".
#   Der volle Lauf auf dem Kopf des Pull Requests ist das Merge-Tor.
# Phase 6 W1 (Weisung P6-2): im vollen Lauf bauen pakete x3 und android zusaetzlich die Release-Dateien
#   (werkzeuge/release/baue_release.sh, Android mit Testschluessel); android fuegt sie zum Artefakt
#   "release-entwurf" zusammen und prueft Lizenzliste und Pruefsummen (T2). Nichts wird hochgeladen;
#   das echte Release macht nur release.yml (nur von Hand, nur von main).
# - werkzeug (Weisung P12-20, Nico 06.11.2026 08:13 MEZ): kleiner Lauf fuer Staende, die NUR das Stadtbau-Werkzeug
#   aendern: sollwerte, tests (ubuntu-latest) mit Start-Test-Teil stadtbau, tests (windows-latest, Einzeltests),
#   pakete (stadtbau win-x64) und android nur mit Werkzeug-APK und Werkzeug-Release-Pruefung; keine Mac-Jobs, keine
#   Pakete der Lernplattform. Ueber workflow_dispatch (stufe: werkzeug) oder das Label "werkzeug" (ohne "voll").
#   Erster Schritt jedes Jobs ist der Waechter werkzeuge/stadtbau/nur_werkzeug.py: jede Datei ausser den Werkzeug-
#   Dateien (src/Stadtbau.*, tests/Stadtbau.Tests, werkzeuge/stadtbau, AENDERUNGEN_STADTBAU.md, Zeile StadtbauVersion,
#   .md) macht ihn sofort rot ("voller Lauf noetig: <Datei>"). Merge-Tor eines reinen Werkzeug-PRs = werkzeug 5/5,
#   sonst voll 17/17; release.yml der Lernplattform verlangt immer 17/17.
# - ohne-mac (Welle CI schneller 2, Meldung P12-84 Punkt 4, Nico Frage 2 = a, Weisung P12-131): der volle Lauf ohne die
#   sieben Mac-Jobs (10 Jobs), nur fuer Staende, die keine Datei der Liste in werkzeuge/ci/ohne_mac.py aendern (App,
#   Desktop, Spiel/Probe, Ton, Update, Diagnose, Projektdateien, Start-Test, Pakete, Release, Lizenzen, Workflows,
#   Directory.*, global.json, Mac-/Update-/Release-Tests). Ueber workflow_dispatch (stufe: ohne-mac) oder das Label
#   "ohne-mac" (ohne "voll"). Erster Schritt jedes Jobs ist der Waechter ohne_mac.py ("Mac-Teile noetig: <Datei>").
#   Merge-Tor eines solchen PRs = ohne-mac 10/10; release.yml verlangt vor jedem Release immer den vollen Lauf 17/17.
# Am Ende jedes Laufs sagt der Hinweis-Job "urteil (GitHub oder echt)" (immer gruen, zaehlt nicht mit), ob ein Rot nur
#   von GitHub kommt; dann nur die roten Jobs neu starten (werkzeuge/starttest/urteil_github.py).
# NuGet-Zwischenspeicher (actions/cache fuer ~/.nuget/packages) gemessen in Meldung P12-87: kein Gewinn (Laden so langsam
#   wie nuget.org, am Mac bis 33 s Verlust, fast 10 GB Speicher). Nicht wieder einbauen ohne neue Messung (Weisung P12-135).
# Ein Label ausser "voll", "ohne-mac" und "werkzeug" startet nichts und bricht nichts ab (alle Teile uebersprungen).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      stufe:
        description: "Stufe: voll (alle 17 Jobs), ohne-mac (10 Jobs, Waechter ohne_mac.py), schnell oder werkzeug (nur Werkzeug, 5 Jobs)"
        type: choice
        options: [voll, ohne-mac, schnell, werkzeug]
        default: voll

permissions:
  contents: read

# B3: je Pull Request eine Gruppe, ein neuer Push bricht den alten Lauf ab. Laeufe auf main,
# ueber workflow_dispatch und Label ausser "voll" bekommen eine eigene Gruppe (nie abgebrochen).
concurrency:
  group: ${{ (github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name != 'voll' && github.event.label.name != 'werkzeug' && github.event.label.name != 'ohne-mac')) && format('ci-{0}', github.run_id) || format('ci-pr-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  # Phase 8 W8 (Teilplan P8-15 4): Pruefstand stumm, der stille Tondienst zaehlt nur die Anlaesse
  LERNPLATTFORM_TON: "aus"
  # Weisung P12-20: Stufe dieses Laufs fuer Schritte (voll, werkzeug oder schnell; Jobs pruefen sie in ihrem if selbst)
  CI_STUFE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.stufe == 'voll') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'voll'))) && 'voll' || (((github.event_name == 'workflow_dispatch' && inputs.stufe == 'ohne-mac') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ohne-mac') && !contains(github.event.pull_request.labels.*.name, 'voll'))) && 'ohne-mac' || (((github.event_name == 'workflow_dispatch' && inputs.stufe == 'werkzeug') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'werkzeug') && !contains(github.event.pull_request.labels.*.name, 'voll') && !contains(github.event.pull_request.labels.*.name, 'ohne-mac'))) && 'werkzeug' || 'schnell')) }}

jobs:
  tests:
    name: tests (${{ matrix.os }}${{ matrix.teil != '' && format(', {0}', matrix.teil) || '' }})
    # schnell nur ubuntu-latest, voll alle drei Systeme
    if: (github.event.action != 'labeled' || github.event.label.name == 'voll' || github.event.label.name == 'werkzeug' || github.event.label.name == 'ohne-mac')
    # Welle CI schneller (Weisung P11-38, Sammelliste 209): die langen Teile laufen als eigene Jobs nebeneinander
    # (gleiche Pruefungen, gleiche Grenzen, Wachhund und Neustart-Regel je Teil wie vorher). Jeder Eintrag sagt, welche
    # Teile er prueft: einzel = Unit-Tests und Python-Pruefungen, lernen/spiel = Start-Test, metal = Messung macOS nur
    # Metal, layout100/layout150 = Layout Windows. ubuntu-latest bleibt ein Job mit allen Teilen (Stufe schnell
    # unveraendert). Hoechstens 5 Mac-Jobs laufen bei GitHub gleichzeitig: darum 2 Jobs fuer macos-15, 3 fuer den
    # Intel-Mac, dazu die 2 Mac-Pakete. Merge-Tor = alle 17 Jobs des vollen Laufs gruen (release.yml; seit Phase 13
    # Welle 2 mit pakete (stadtbau win-x64)).
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.stufe == 'voll') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'voll'))) && '[{"os":"ubuntu-latest","teil":"","kurz":"alle","einzel":true,"lernen":true,"spiel":true},{"os":"windows-latest","teil":"Einzeltests","kurz":"einzel","einzel":true},{"os":"windows-latest","teil":"Lernteil und Spiel","kurz":"lernen-spiel","lernen":true,"spiel":true},{"os":"windows-latest","teil":"Layout 100","kurz":"layout100","layout100":true},{"os":"windows-latest","teil":"Layout 150","kurz":"layout150","layout150":true},{"os":"macos-15","teil":"Einzeltests und Lernteil","kurz":"einzel-lernen","einzel":true,"lernen":true},{"os":"macos-15","teil":"Spiel und Metal","kurz":"spiel-metal","spiel":true,"metal":true},{"os":"macos-15-intel","teil":"Einzeltests und Spiel","kurz":"einzel-spiel","einzel":true,"spiel":true},{"os":"macos-15-intel","teil":"Lernteil","kurz":"lernen","lernen":true},{"os":"macos-15-intel","teil":"Metal","kurz":"metal","metal":true}]' || (((github.event_name == 'workflow_dispatch' && inputs.stufe == 'ohne-mac') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ohne-mac') && !contains(github.event.pull_request.labels.*.name, 'voll'))) && '[{"os":"ubuntu-latest","teil":"","kurz":"alle","einzel":true,"lernen":true,"spiel":true},{"os":"windows-latest","teil":"Einzeltests","kurz":"einzel","einzel":true},{"os":"windows-latest","teil":"Lernteil und Spiel","kurz":"lernen-spiel","lernen":true,"spiel":true},{"os":"windows-latest","teil":"Layout 100","kurz":"layout100","layout100":true},{"os":"windows-latest","teil":"Layout 150","kurz":"layout150","layout150":true}]' || (((github.event_name == 'workflow_dispatch' && inputs.stufe == 'werkzeug') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'werkzeug') && !contains(github.event.pull_request.labels.*.name, 'voll') && !contains(github.event.pull_request.labels.*.name, 'ohne-mac'))) && '[{"os":"ubuntu-latest","teil":"","kurz":"alle","einzel":true,"lernen":true,"spiel":true},{"os":"windows-latest","teil":"Einzeltests","kurz":"einzel","einzel":true}]' || '[{"os":"ubuntu-latest","teil":"","kurz":"alle","einzel":true,"lernen":true,"spiel":true}]'))) }}
    runs-on: ${{ matrix.os }}
    # Phase 11 FW10: Name der Messdateien und des Artefakts messung-<OS>-<Teil>-<Versuch>. runner.os ist auf
    # beiden Macs "macOS"; der Intel-Mac heisst darum "macOS-intel" (sonst gleicher Artefaktname).
    env:
      MESS_OS: ${{ matrix.os == 'macos-15-intel' && 'macOS-intel' || (startsWith(matrix.os, 'macos') && 'macOS' || (startsWith(matrix.os, 'windows') && 'Windows' || 'Linux')) }}
      # Weisung P11-19 (Nico 03.11.2026, Antwort 1a): feste Ausnahme NUR fuer den Intel-Mac. Messzeiten ueber
      # der Grenze stehen dort als INFO-Zeile (Wert, Grenze, Einzelmessungen) und machen den Lauf nicht rot;
      # Layout-, Kontrast-, Absturzfunde und Unit-Tests bleiben rot (werkzeuge/starttest/urteil.py). Alle anderen
      # Systeme: leer = unveraendert streng.
      LERNPLATTFORM_ZEITEN_NUR_INFO: ${{ matrix.os == 'macos-15-intel' && 'macos-15-intel' || '' }}
    steps:
      - uses: actions/checkout@v7
      # Weisung P12-20: Waechter der Stufe werkzeug, erster Schritt; eine Datei ausserhalb des Werkzeugs macht ihn rot
      #   (Baum des Kopfs gegen origin/main; ein Lauf auf main selbst prueft den letzten Squash-Merge gegen den Commit davor)
      - uses: actions/setup-python@v7
        if: env.CI_STUFE == 'werkzeug' || env.CI_STUFE == 'ohne-mac'
        with:
          python-version: "3.12"
      - name: Waechter nur Werkzeug (nur_werkzeug.py)
        if: env.CI_STUFE == 'werkzeug'
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin +refs/heads/main:refs/remotes/origin/main
          python -I werkzeuge/stadtbau/nur_werkzeug.py selbsttest
          python -I werkzeuge/stadtbau/nur_werkzeug.py pruefen
      # Welle CI schneller 2 (Weisung P12-131, Nico Frage 2 = a): Waechter der Stufe ohne-mac; eine Datei, die die
      #   Mac-Teile noetig macht (Liste in werkzeuge/ci/ohne_mac.py), macht ihn rot ("Mac-Teile noetig: <Datei>")
      - name: Waechter ohne Mac (ohne_mac.py)
        if: env.CI_STUFE == 'ohne-mac'
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin +refs/heads/main:refs/remotes/origin/main
          python -I werkzeuge/ci/ohne_mac.py selbsttest
          python -I werkzeuge/ci/ohne_mac.py pruefen
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Tests
        if: matrix.einzel
        run: dotnet test --project tests/Lernplattform.Tests -c Release
      # Phase 13 Welle 2 (Weisung P12-17): Unit-Tests des Stadtbau-Werkzeugs (Projekt, Pruefungen, Grenzen, Export)
      - name: Tests Stadtbau-Werkzeug
        if: matrix.einzel
        run: dotnet test --project tests/Stadtbau.Tests -c Release
      # Welle 4 (Weisung P2-11, R16/A3/A4/F5): Python 0.63.2 liest die Sicherungen fuer die
      # alte App, die der Test BelegDateienFuerPython eben geschrieben hat, und fuehrt sie zusammen
      - uses: actions/checkout@v7
        if: runner.os == 'Linux' && matrix.einzel
        with:
          repository: papst2142-cmd/Fisi-Lernplattform
          ref: v0.63.2
          path: python-linie
      # Python auf allen Systemen: Urteil des Start-Tests (werkzeuge/starttest/urteil.py, P4-13)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Phase 6 W1 (T1): Tag-Regel in Python gleich der C#-Regel (dieselben Faelle wie ReleaseTests)
      # Weisung P11-19: Neustart-Regel und Ausnahme Intel-Mac mit festen Faellen (Gegenprobe: ohne Ausnahme rot)
      - name: Urteil des Start-Tests (urteil.py selbsttest)
        if: matrix.einzel
        shell: bash
        run: python -I werkzeuge/starttest/urteil.py selbsttest
      # Weisung P12-20: Waechter der Stufe werkzeug mit festen Faellen und Gegenprobe (in jeder Stufe)
      - name: Waechter Stufe werkzeug (nur_werkzeug.py selbsttest)
        if: runner.os == 'Linux' && matrix.einzel
        run: python3 -I werkzeuge/stadtbau/nur_werkzeug.py selbsttest
      # Welle CI schneller 2 (Weisung P12-131): Waechter ohne-mac mit festen Faellen und Gegenproben
      - name: Waechter Stufe ohne-mac (Selbsttest)
        if: runner.os == 'Linux' && matrix.einzel
        run: python3 -I werkzeuge/ci/ohne_mac.py selbsttest
      - name: Tag-Regel (release.py selbsttest)
        if: runner.os == 'Linux' && matrix.einzel
        run: python3 -I werkzeuge/release/release.py selbsttest
      - name: Sicherung fuer die alte App in Python 0.63.2 einlesen
        if: runner.os == 'Linux' && matrix.einzel
        run: python3 -I werkzeuge/vergleich/pruefe_ruecksicherung.py python-linie tests/Lernplattform.Tests/bin/Release/net10.0/beleg_ruecksicherung
      # Phase 4, W2: C#-Sicherung mit der Fachrichtung (zz-einstellungen) in Python 0.63.2 (+1 Projekt, dokumentiert)
      - name: Sicherung mit Fachrichtung in Python 0.63.2 einlesen
        if: runner.os == 'Linux' && matrix.einzel
        run: python3 -I werkzeuge/vergleich/pruefe_ausbildung.py python-linie tests/Lernplattform.Tests/bin/Release/net10.0/beleg_ausbildung
      # Phase 5, W1 (Plan Risiko 1): Stand nach "Alles ersetzen" der C#-Linie, unabhaengig mit Python 0.63.2 geprueft
      - name: Alles ersetzen mit Python 0.63.2 pruefen
        if: runner.os == 'Linux' && matrix.einzel
        run: python3 -I werkzeuge/vergleich/pruefe_wiederherstellung.py python-linie tests/Lernplattform.Tests/bin/Release/net10.0/beleg_wiederherstellung
      # Weisung P11-38: nur Jobs mit einem Start-Test-Teil bauen das Programm; alle Start-Test-Schritte haengen an
      # diesem Schritt (vorher am 1. Lauf des Lernteils, der jetzt nicht in jedem Job laeuft)
      - name: Desktop bauen
        id: bauen
        if: matrix.einzel || matrix.lernen || matrix.spiel || matrix.metal || matrix.layout100 || matrix.layout150
        run: dotnet build src/Lernplattform.Desktop -c Release
      # Phase 13 Welle 2 (Weisung P12-17): das Werkzeug ist nur fuer Windows-PC und Android-Tablet; sein Start-Test
      # (Teil stadtbau) laeuft darum unter Linux (Xvfb wie die Lernplattform) und Windows, im Job mit dem Lernteil
      - name: Werkzeug bauen
        id: bauen_werkzeug
        if: matrix.lernen && runner.os != 'macOS'
        run: dotnet build src/Stadtbau.Desktop -c Release
      # Phase 11 (Weisung P11-29): Gegenprobe ohne Schluessel, das Programm sendet nichts und meldet "nicht verfuegbar"
      - name: Fehlerbericht-Gegenprobe ohne Schluessel
        if: runner.os == 'Linux' && matrix.einzel
        shell: bash
        run: |
          set +e
          LERNPLATTFORM_DATEN="$(mktemp -d)" LERNPLATTFORM_BERICHT_PROBE=gegenprobe src/Lernplattform.Desktop/bin/Release/net10.0/Lernplattform | tee bericht_gegenprobe.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" = 2 && grep -q "nicht verfuegbar" bericht_gegenprobe.txt
      # Start ohne Bedienung (Phase 1): jede Seite oeffnen, Hell/Dunkel und Schriftstufen
      # wechseln, Layoutpruefung breit und schmal (384 x 832). Rot bei Absturz, bei einem
      # Wert ueber 1000 ms oder einem Layoutfund (Rueckgabe 3). Ueberschreitet ein
      # wiederholbarer Messpunkt seine Grenze, misst der Start-Test ihn bis zu 3 Mal (P4-12 B6).
      # Neustart-Regel (Weisung P4-13): Rueckgabe 3 im 1. Lauf -> 2. Lauf in neuem Prozess mit
      # frischem Datenordner; rot nur, wenn derselbe Messpunkt in beiden Laeufen rot ist.
      # Absturz (andere Rueckgabe, Ausnahme, keine Messdatei) startet nicht neu und ist rot.
      # Wachhund je Lauf 15 Minuten (vorher 10): mit den Spielansichten aus Phase 7 braucht ein
      # gesunder Lauf auf Windows und macOS 9,5 bis 10 Minuten (P7-13a); die Messgrenzen bleiben.
      # Sammelliste 106 (Weisung P8-2): Lernteil und Spielansichten als eigene Schritte, jeder mit
      # eigenem Wachhund, eigener Neustart-Regel und eigenen Messdateien. Weisung P8-3 (E2 Chat):
      # Spielschritte 10 Minuten (Lauf 40326477854: hoechstens 64 s); die Lernschritte bleiben bei
      # 15 Minuten, bis ein zweiter voller Lauf alle unter 9 Minuten zeigt (dann W3).
      # Weisung P8-5 (W3): Lauf 40351299271 zeigte ubuntu 476 s, windows 540 s, macOS 594 s, nicht
      # alle unter 540 s; darum bleiben die Lernschritte bei 15 Minuten.
      # Weisung P11-19: nur der Intel-Mac (macos-15-intel, langsamer, Lauf 450: 15 min) 25 bzw. Spiel 20 Minuten.
      # Sammelliste 199 (Weisung P11-22): STARTTEST_WACHHUND_MINUTEN = Schrittzeit minus 1 Minute; lauf.sh beendet einen
      # haengenden Lauf vorher selbst mit Angaben (USR1, macOS sample, haenger.log) und Rueckgabe 4 (sofort rot).
      # urteil.py selbsttest prueft, dass jeder Wachhund unter seiner Schrittzeit liegt.
      # Weisung P11-38: ein 2. Lauf folgt nur, wenn urteil.py ihn verlangt (Ausgabe zweiter_lauf). Am Intel-Mac
      # verlangt es ihn nicht, wenn der 1. Lauf nur Messzeiten der festen Ausnahme P11-19 hat; jeder andere Fund
      # (Layout, Kontrast, Absturz, Grenzen Dreiecke/Aufrufe) und jedes andere System: 2. Lauf wie bisher.
      - name: Start ohne Bedienung (1. Lauf)
        id: lauf1
        if: matrix.lernen && steps.bauen.outcome == 'success'
        timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 25 || 15 }}
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: lernen
          STARTTEST_WACHHUND_MINUTEN: ${{ matrix.os == 'macos-15-intel' && 24 || 14 }}
        run: bash werkzeuge/starttest/lauf.sh 1 messung_${{ env.MESS_OS }}_lauf1_versuch${{ github.run_attempt }}.txt
      - name: Start ohne Bedienung (2. Lauf, neuer Prozess, frischer Datenordner)
        if: steps.lauf1.outputs.rc == '3' && steps.lauf1.outputs.zweiter_lauf != 'nein'
        timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 25 || 15 }}
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: lernen
          STARTTEST_WACHHUND_MINUTEN: ${{ matrix.os == 'macos-15-intel' && 24 || 14 }}
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_lauf2
        run: bash werkzeuge/starttest/lauf.sh 2 messung_${{ env.MESS_OS }}_lauf2_versuch${{ github.run_attempt }}.txt messung_${{ env.MESS_OS }}_lauf1_versuch${{ github.run_attempt }}.txt
      - name: Spielansichten ohne Bedienung (1. Lauf, frischer Datenordner)
        id: spiel1
        if: always() && matrix.spiel && steps.bauen.outcome == 'success'
        timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 20 || 10 }}
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: spiel
          STARTTEST_WACHHUND_MINUTEN: ${{ matrix.os == 'macos-15-intel' && 19 || 9 }}
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_spiel1
        run: bash werkzeuge/starttest/lauf.sh 1 messung_${{ env.MESS_OS }}_spiel1_versuch${{ github.run_attempt }}.txt
      - name: Spielansichten ohne Bedienung (2. Lauf, neuer Prozess, frischer Datenordner)
        if: always() && steps.spiel1.outputs.rc == '3' && steps.spiel1.outputs.zweiter_lauf != 'nein'
        timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 20 || 10 }}
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: spiel
          STARTTEST_WACHHUND_MINUTEN: ${{ matrix.os == 'macos-15-intel' && 19 || 9 }}
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_spiel2
        run: bash werkzeuge/starttest/lauf.sh 2 messung_${{ env.MESS_OS }}_spiel2_versuch${{ github.run_attempt }}.txt messung_${{ env.MESS_OS }}_spiel1_versuch${{ github.run_attempt }}.txt
      # Phase 7 W1 (Plan Abschnitt 4): eigener kurzer Lauf ohne OpenGL (--software, nur Windows und Linux;
      # macOS hat keinen Software-Schalter). Erwartet: Hinweis und Ortsliste, kein Absturz, Urteil gruen.
      - name: Spiel ohne OpenGL (kurzer Lauf mit Zeichnen in Software)
        if: always() && runner.os != 'macOS' && matrix.spiel && steps.bauen.outcome == 'success'
        timeout-minutes: 5
        shell: bash
        env:
          LERNPLATTFORM_SOFTWARE: "1"
          LERNPLATTFORM_MESSUNG_TEIL: spiel-ersatz
          STARTTEST_WACHHUND_MINUTEN: 4
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_ersatz
        run: |
          datei=messung_${{ env.MESS_OS }}_ersatz_versuch${{ github.run_attempt }}.txt
          bash werkzeuge/starttest/lauf.sh 1 "$datei" || true
          cat "$datei" || true
          grep -q "^URTEIL: gruen" "$datei" || { echo "FEHLER: Spiel ohne OpenGL nicht gruen"; exit 1; }
      # Phase 13 Welle 2 (Weisung P12-17): Start-Test des Werkzeugs (Layoutpruefung PC 1440 x 810 und Tablet
      # 1280 x 800 hell und dunkel, Namen fuer den Screenreader, Messpunkte 400 ms, Fund 216 rot im Elektromarkt,
      # Export geprueft). Gleiche Neustart-Regel und gleicher Wachhund wie die anderen Teile. Nach den Teilen der
      # Lernplattform, weil Windows dafuer die Anzeige auf 1920 x 1080 stellt (Vorgabe des Runners 1024 x 768 ist
      # kleiner als die PC-Groesse 1440 x 810, Lauf 545); die Lernplattform-Teile laufen so unveraendert.
      - name: Windows-Anzeige 1920 x 1080 (Werkzeug)
        id: anzeige_werkzeug
        if: always() && runner.os == 'Windows' && steps.bauen_werkzeug.outcome == 'success'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Werkzeug ohne Bedienung (1. Lauf, frischer Datenordner)
        id: werkzeug1
        if: always() && steps.bauen_werkzeug.outcome == 'success' && (runner.os != 'Windows' || steps.anzeige_werkzeug.outcome == 'success')
        timeout-minutes: 10
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: stadtbau
          STARTTEST_WACHHUND_MINUTEN: 9
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_werkzeug1
        run: bash werkzeuge/starttest/lauf.sh 1 messung_${{ env.MESS_OS }}_werkzeug1_versuch${{ github.run_attempt }}.txt
      - name: Werkzeug ohne Bedienung (2. Lauf, neuer Prozess, frischer Datenordner)
        if: always() && steps.werkzeug1.outputs.rc == '3' && steps.werkzeug1.outputs.zweiter_lauf != 'nein'
        timeout-minutes: 10
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: stadtbau
          STARTTEST_WACHHUND_MINUTEN: 9
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_werkzeug2
        run: bash werkzeuge/starttest/lauf.sh 2 messung_${{ env.MESS_OS }}_werkzeug2_versuch${{ github.run_attempt }}.txt messung_${{ env.MESS_OS }}_werkzeug1_versuch${{ github.run_attempt }}.txt
      # Phase 7 W1, nur Messung (Plan Abschnitt 3, Weg 1). Mac-Welle (Weisung P11-28): am Mac ist OpenGL jetzt die
      # Vorgabe (der Standard-Start-Test oben misst sie, Rueckfall Ortsliste, weil die CI-Macs kein GL haben); dieser
      # Schritt misst umgekehrt den alten Weg mit dem Notschalter LERNPLATTFORM_MAC_METAL=1. Aendert kein Urteil.
      # Sammelliste 213 (Weisung P11-40): bis A 0.38.0 lief hier der ganze Start-Test (Lernteil und Spiel) in einem
      # Prozess unter einer Schrittzeit von 20 min, die nur fuer den Spielteil bemessen war; am Intel-Mac dauert allein
      # der Lernteil rund 17,5 min (Lauf 499), der ganze Lauf 18,6 bis ueber 19 min, Versuch 1 lief in den Wachhund.
      # Jetzt zwei Schritte mit denselben Teilen, Schrittzeiten und Wachhund-Minuten wie die gewerteten Schritte oben
      # (lernen 25/15, spiel 20/10); gemessen wird dasselbe wie vorher, nur getrennt, jeder mit frischem Datenordner.
      - name: Nur Messung macOS nur Metal, Lernteil (Notschalter, ohne Urteil)
        if: always() && runner.os == 'macOS' && matrix.metal && steps.bauen.outcome == 'success'
        timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 25 || 15 }}
        shell: bash
        env:
          LERNPLATTFORM_MAC_METAL: "1"
          LERNPLATTFORM_MESSUNG_TEIL: lernen
          STARTTEST_WACHHUND_MINUTEN: ${{ matrix.os == 'macos-15-intel' && 24 || 14 }}
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_mac_metal_lernen
        run: |
          datei=messung_${{ env.MESS_OS }}_macmetal_lernen_versuch${{ github.run_attempt }}.txt
          GITHUB_OUTPUT=/dev/null bash werkzeuge/starttest/lauf.sh 1 "$datei" || true
          grep -E "^(Schalter|Spiel|URTEIL)|FEHLER" "$datei" || true
      - name: Nur Messung macOS nur Metal, Spiel (Notschalter, ohne Urteil)
        if: always() && runner.os == 'macOS' && matrix.metal && steps.bauen.outcome == 'success'
        timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 20 || 10 }}
        shell: bash
        env:
          LERNPLATTFORM_MAC_METAL: "1"
          LERNPLATTFORM_MESSUNG_TEIL: spiel
          STARTTEST_WACHHUND_MINUTEN: ${{ matrix.os == 'macos-15-intel' && 19 || 9 }}
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_mac_metal_spiel
        run: |
          datei=messung_${{ env.MESS_OS }}_macmetal_spiel_versuch${{ github.run_attempt }}.txt
          GITHUB_OUTPUT=/dev/null bash werkzeuge/starttest/lauf.sh 1 "$datei" || true
          grep -E "^(Schalter|Spiel|URTEIL)|FEHLER" "$datei" || true
      # Phase 11 W3 (Weisung P11-21): Layoutpruefung unter Windows in voller PC-Groesse und mit Skalierung 150 %.
      # Der Runner hat nur 1024 x 768 (die PC-Groesse 1360 x 880 wurde dort nie erreicht, Sammelliste 196); die
      # Probe (Lauf 41624963833) zeigte: Set-DisplayResolution 1920 x 1080 und die Skalierung ueber
      # SystemParametersInfo(SPI_SETLOGICALDPIOVERRIDE) wirken sofort (96 -> 144 DPI). Teil "layout" prueft nur das
      # Layout (alle Schriftstufen, Groessen, Ansichten, Namen); Zeiten sind dort nur Angabe. Das Programm prueft
      # selbst, dass es die Skalierung sieht (LERNPLATTFORM_SKALIERUNG_ERWARTET) und bei 100 % die volle PC-Groesse
      # erreicht (LERNPLATTFORM_VOLLE_PC_GROESSE). Neustart-Regel wie oben.
      - name: Windows-Anzeige 1920 x 1080
        id: anzeige
        if: always() && runner.os == 'Windows' && (matrix.layout100 || matrix.layout150) && steps.bauen.outcome == 'success'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Layout Windows 100 % (1. Lauf, frischer Datenordner)
        id: layout100
        if: always() && matrix.layout100 && steps.anzeige.outcome == 'success'
        timeout-minutes: 15
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: layout
          LERNPLATTFORM_VOLLE_PC_GROESSE: "1"
          LERNPLATTFORM_SKALIERUNG_ERWARTET: "1"
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_layout100_1
        run: bash werkzeuge/starttest/lauf.sh 1 messung_${{ env.MESS_OS }}_layout100a_versuch${{ github.run_attempt }}.txt
      - name: Layout Windows 100 % (2. Lauf, neuer Prozess, frischer Datenordner)
        if: always() && steps.layout100.outputs.rc == '3' && steps.layout100.outputs.zweiter_lauf != 'nein'
        timeout-minutes: 15
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: layout
          LERNPLATTFORM_VOLLE_PC_GROESSE: "1"
          LERNPLATTFORM_SKALIERUNG_ERWARTET: "1"
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_layout100_2
        run: bash werkzeuge/starttest/lauf.sh 2 messung_${{ env.MESS_OS }}_layout100b_versuch${{ github.run_attempt }}.txt messung_${{ env.MESS_OS }}_layout100a_versuch${{ github.run_attempt }}.txt
      - name: Windows-Skalierung 150 %
        id: skalierung
        if: always() && matrix.layout150 && steps.anzeige.outcome == 'success'
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Anzeige {
            [DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint aktion, int wert, IntPtr zeiger, uint melden);
          }
          '@
          # SPI_SETLOGICALDPIOVERRIDE (0x009F): Stufen ueber der empfohlenen (100 %), 2 = 150 %; 1 = SPIF_UPDATEINIFILE
          if (-not [Anzeige]::SystemParametersInfo(0x009F, 2, [IntPtr]::Zero, 1)) { throw "Skalierung nicht gesetzt" }
          Start-Sleep -Seconds 2
      - name: Layout Windows 150 % (1. Lauf, frischer Datenordner)
        id: layout150
        if: always() && steps.skalierung.outcome == 'success'
        timeout-minutes: 15
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: layout
          LERNPLATTFORM_SKALIERUNG_ERWARTET: "1.5"
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_layout150_1
        run: bash werkzeuge/starttest/lauf.sh 1 messung_${{ env.MESS_OS }}_layout150a_versuch${{ github.run_attempt }}.txt
      - name: Layout Windows 150 % (2. Lauf, neuer Prozess, frischer Datenordner)
        if: always() && steps.layout150.outputs.rc == '3' && steps.layout150.outputs.zweiter_lauf != 'nein'
        timeout-minutes: 15
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: layout
          LERNPLATTFORM_SKALIERUNG_ERWARTET: "1.5"
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_layout150_2
        run: bash werkzeuge/starttest/lauf.sh 2 messung_${{ env.MESS_OS }}_layout150b_versuch${{ github.run_attempt }}.txt messung_${{ env.MESS_OS }}_layout150a_versuch${{ github.run_attempt }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: messung-${{ env.MESS_OS }}-${{ matrix.kurz }}-${{ github.run_attempt }}
          path: messung_${{ env.MESS_OS }}_*_versuch${{ github.run_attempt }}.txt
          if-no-files-found: ignore
        if: always()
      # Sicherungsschritt (Weisung P4-14 c): 1. Lauf ohne Fehler, aber Rueckgabe weder 0 noch 3
      # (leer, mit \r, verlorene Ausgabe) -> rot. Ein verschwiegenes Rot darf nie gruen enden.
      - name: Start-Test Rueckgabe pruefen
        if: always() && steps.lauf1.outcome == 'success' && steps.lauf1.outputs.rc != '0' && steps.lauf1.outputs.rc != '3'
        shell: bash
        run: |
          echo "Rueckgabe des 1. Laufs unbekannt, kein Urteil moeglich (Ausgabe rc: '${{ steps.lauf1.outputs.rc }}')"
          exit 1
      - name: Layout Windows Rueckgabe pruefen
        if: always() && ((steps.layout100.outcome == 'success' && steps.layout100.outputs.rc != '0' && steps.layout100.outputs.rc != '3') || (steps.layout150.outcome == 'success' && steps.layout150.outputs.rc != '0' && steps.layout150.outputs.rc != '3'))
        shell: bash
        run: |
          echo "Rueckgabe eines Layout-Laufs unbekannt, kein Urteil moeglich (100 %: '${{ steps.layout100.outputs.rc }}', 150 %: '${{ steps.layout150.outputs.rc }}')"
          exit 1
      - name: Werkzeug Rueckgabe pruefen
        if: always() && steps.werkzeug1.outcome == 'success' && steps.werkzeug1.outputs.rc != '0' && steps.werkzeug1.outputs.rc != '3'
        shell: bash
        run: |
          echo "Rueckgabe des 1. Laufs des Werkzeugs unbekannt, kein Urteil moeglich (Ausgabe rc: '${{ steps.werkzeug1.outputs.rc }}')"
          exit 1
      - name: Spielansichten Rueckgabe pruefen
        if: always() && steps.spiel1.outcome == 'success' && steps.spiel1.outputs.rc != '0' && steps.spiel1.outputs.rc != '3'
        shell: bash
        run: |
          echo "Rueckgabe des 1. Laufs der Spielansichten unbekannt, kein Urteil moeglich (Ausgabe rc: '${{ steps.spiel1.outputs.rc }}')"
          exit 1

  pakete:
    # Spike D: Pakete mit Velopack (Windows-Setup, Linux-AppImage, macOS) und
    # Update-Probe A 0.64.0 -> A 0.64.1 -> B 0.1.0, Rueckschritt muss abgelehnt werden.
    name: pakete (${{ matrix.rid }})
    # Stufe voll (4 Pakete) und ohne-mac (Welle CI schneller 2: nur win-x64 und linux-x64, Listen voll, ohne-mac)
    # Phase 11 FW10 (Weisung P11-18): Intel-Mac osx-x64 mit eigenem Velopack-Kanal
    if: (github.event.action != 'labeled' || github.event.label.name == 'voll' || github.event.label.name == 'werkzeug' || github.event.label.name == 'ohne-mac') && (((github.event_name == 'workflow_dispatch' && inputs.stufe == 'voll') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'voll'))) || ((github.event_name == 'workflow_dispatch' && inputs.stufe == 'ohne-mac') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ohne-mac') && !contains(github.event.pull_request.labels.*.name, 'voll'))))
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.stufe == 'voll') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'voll'))) && '[{"os":"windows-latest","rid":"win-x64"},{"os":"ubuntu-latest","rid":"linux-x64"},{"os":"macos-15","rid":"osx-arm64"},{"os":"macos-15-intel","rid":"osx-x64"}]' || '[{"os":"windows-latest","rid":"win-x64"},{"os":"ubuntu-latest","rid":"linux-x64"}]') }}
    runs-on: ${{ matrix.os }}
    # Phase 6 W1: 30 -> 45 Minuten, weil der Release-Bau (zweites publish und pack) dazukommt
    timeout-minutes: 45
    # BEFRISTET bis 1.0 (Weisung P11-29/P11-30, Frage 3a): Schluessel fuer "Bericht senden" nur im Dispatch-Lauf
    # (Stufe voll), nie in PR-Laeufen; der Bau maskiert ihn (Lernplattform.Core.csproj), keine Ausgabe nennt ihn.
    env:
      FEHLERBERICHT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.FEHLERBERICHT_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Welle CI schneller 2: Waechter der Stufe ohne-mac (wie in tests)
      - name: Waechter ohne Mac (ohne_mac.py)
        if: env.CI_STUFE == 'ohne-mac'
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin +refs/heads/main:refs/remotes/origin/main
          python -I werkzeuge/ci/ohne_mac.py selbsttest
          python -I werkzeuge/ci/ohne_mac.py pruefen
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Werkzeuge
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y -q squashfs-tools; fi
      - name: Pakete bauen und Update pruefen
        shell: bash
        env:
          PYTHON: python
          # Sammelliste 258: Live-Probe fragt die GitHub-API angemeldet (sonst HTTP 403 rate limit)
          GITHUB_TOKEN: ${{ github.token }}
        run: bash werkzeuge/pakete/pakete_und_update.sh ${{ matrix.rid }} pakete
      - uses: actions/upload-artifact@v7
        with:
          name: paket-${{ matrix.rid }}-A-0.64.0
          path: pakete/feed-A-0.64.0/
      - uses: actions/upload-artifact@v7
        with:
          name: updateprobe-${{ matrix.rid }}-A-0.64.1
          path: pakete/feed-A-0.64.1/
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: appimage-linux-x64-A-0.64.0-tar
          path: pakete/appimage/
      # Phase 6 W1 (VE1/VE4): Release-Dateien aus dem Stand im Repo, jede Datei in der Lizenzliste
      - name: Release-Dateien bauen (ohne Hochladen)
        shell: bash
        env:
          PYTHON: python
        run: bash werkzeuge/release/baue_release.sh ${{ matrix.rid }} release
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: release/release-${{ matrix.rid }}/
          if-no-files-found: error
      # Phase 11 (Weisung P11-29): "Bericht senden" mit dem eingebauten Schluessel, Datei berichte/_probe_<Lauf>.md in
      # fi-fehlerberichte; ohne Schluessel (PR-Lauf mit Label voll) muss das Programm "nicht verfuegbar" melden.
      - name: Fehlerbericht-Probe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -n "$FEHLERBERICHT_TOKEN" ]; then echo "FEHLERBERICHT_TOKEN vorhanden: ja"; else echo "FEHLERBERICHT_TOKEN vorhanden: nein"; fi
          dotnet publish src/Lernplattform.Desktop -c Release -r linux-x64 --self-contained -p:DebugType=none -o bericht-probe
          DATEN=$(mktemp -d)
          set +e
          LERNPLATTFORM_DATEN="$DATEN" LERNPLATTFORM_BERICHT_PROBE="${{ github.run_number }}-${{ github.run_attempt }}" ./bericht-probe/Lernplattform
          rc=$?
          set -e
          if [ -n "$FEHLERBERICHT_TOKEN" ]; then soll=0; else soll=2; fi
          if [ "$rc" != "$soll" ]; then echo "FEHLER: Bericht-Probe Rueckgabe $rc, erwartet $soll"; cat "$DATEN"/fehler.log 2>/dev/null; exit 1; fi
          if strings -a bericht-probe/Lernplattform.Core.dll | grep -q github_pat_; then echo "FEHLER: lesbarer Schluessel im Programm"; exit 1; fi
          echo "Bericht-Probe: Rueckgabe $rc wie erwartet"

  pakete-stadtbau:
    # Phase 13 Welle 2 (Weisung P12-17): Windows-Paket des Stadtbau-Werkzeugs (eigene Linie S, Velopack-Kanal
    # stadtbau-win, Kennung Fachinformatiker-Stadtbau), jede Datei in der Lizenzliste; nichts hochgeladen.
    name: pakete (stadtbau win-x64)
    # nur Stufe voll
    if: (github.event.action != 'labeled' || github.event.label.name == 'voll' || github.event.label.name == 'werkzeug' || github.event.label.name == 'ohne-mac') && (((github.event_name == 'workflow_dispatch' && inputs.stufe == 'voll') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'voll'))) || ((github.event_name == 'workflow_dispatch' && inputs.stufe == 'ohne-mac') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ohne-mac') && !contains(github.event.pull_request.labels.*.name, 'voll'))) || ((github.event_name == 'workflow_dispatch' && inputs.stufe == 'werkzeug') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'werkzeug') && !contains(github.event.pull_request.labels.*.name, 'voll') && !contains(github.event.pull_request.labels.*.name, 'ohne-mac'))))
    runs-on: windows-latest
    timeout-minutes: 30
    # BEFRISTET bis 1.0 (Weisung P11-29/P11-30): Schluessel fuer "An CC senden" nur im Dispatch-Lauf, nie in PR-Laeufen
    env:
      FEHLERBERICHT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.FEHLERBERICHT_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7
      # Weisung P12-20: Waechter der Stufe werkzeug, erster Schritt; eine Datei ausserhalb des Werkzeugs macht ihn rot
      #   (Baum des Kopfs gegen origin/main; ein Lauf auf main selbst prueft den letzten Squash-Merge gegen den Commit davor)
      - uses: actions/setup-python@v7
        if: env.CI_STUFE == 'werkzeug' || env.CI_STUFE == 'ohne-mac'
        with:
          python-version: "3.12"
      - name: Waechter nur Werkzeug (nur_werkzeug.py)
        if: env.CI_STUFE == 'werkzeug'
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin +refs/heads/main:refs/remotes/origin/main
          python -I werkzeuge/stadtbau/nur_werkzeug.py selbsttest
          python -I werkzeuge/stadtbau/nur_werkzeug.py pruefen
      # Welle CI schneller 2 (Weisung P12-131, Nico Frage 2 = a): Waechter der Stufe ohne-mac; eine Datei, die die
      #   Mac-Teile noetig macht (Liste in werkzeuge/ci/ohne_mac.py), macht ihn rot ("Mac-Teile noetig: <Datei>")
      - name: Waechter ohne Mac (ohne_mac.py)
        if: env.CI_STUFE == 'ohne-mac'
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin +refs/heads/main:refs/remotes/origin/main
          python -I werkzeuge/ci/ohne_mac.py selbsttest
          python -I werkzeuge/ci/ohne_mac.py pruefen
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Werkzeuge
        shell: bash
        run: dotnet tool install -g vpk --version 1.2.161
      - name: Werkzeug-Paket bauen (Setup, Feed, Lizenzen)
        shell: bash
        env:
          PYTHON: python
          # Sammelliste 258: Live-Probe fragt die GitHub-API angemeldet (sonst HTTP 403 rate limit)
          GITHUB_TOKEN: ${{ github.token }}
        run: bash werkzeuge/stadtbau/baue_stadtbau.sh win-x64 stadtbau
      - uses: actions/upload-artifact@v7
        with:
          name: stadtbau-win-x64
          path: stadtbau/stadtbau-win-x64/
          if-no-files-found: error

  sollwerte:
    # Welle Sammelliste 217 (Weisung P12-14, Nico 1a 2a 3a 4a 5a): die Vergleichswerte G1-G52 (tests/Vergleich),
    # inhalte/ (byte-gleich mit Python v0.63.2), die fuenf Zeichen-Tabellen und einteilung_bisher.json sind feste
    # Sollwerte "Stand C#". Die CI erzeugt sie nicht mehr aus der Python-Linie (vorher Job "vergleichswerte"), sondern
    # prueft ihre SHA-256 gegen tests/Vergleich/SOLLWERTE.sha256. Aenderung nur mit Nicos Freigabe und Eintrag in
    # tests/Vergleich/AENDERUNGEN_SOLLWERTE.md (gleiche Regeln prueft SollwerteTests auf allen Systemen).
    # Stufe schnell und voll.
    name: sollwerte (Pruefsummen)
    if: (github.event.action != 'labeled' || github.event.label.name == 'voll' || github.event.label.name == 'werkzeug' || github.event.label.name == 'ohne-mac')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Weisung P12-20: Waechter der Stufe werkzeug, erster Schritt; eine Datei ausserhalb des Werkzeugs macht ihn rot
      #   (Baum des Kopfs gegen origin/main; ein Lauf auf main selbst prueft den letzten Squash-Merge gegen den Commit davor)
      - uses: actions/setup-python@v7
        if: env.CI_STUFE == 'werkzeug' || env.CI_STUFE == 'ohne-mac'
        with:
          python-version: "3.12"
      - name: Waechter nur Werkzeug (nur_werkzeug.py)
        if: env.CI_STUFE == 'werkzeug'
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin +refs/heads/main:refs/remotes/origin/main
          python -I werkzeuge/stadtbau/nur_werkzeug.py selbsttest
          python -I werkzeuge/stadtbau/nur_werkzeug.py pruefen
      # Welle CI schneller 2 (Weisung P12-131, Nico Frage 2 = a): Waechter der Stufe ohne-mac; eine Datei, die die
      #   Mac-Teile noetig macht (Liste in werkzeuge/ci/ohne_mac.py), macht ihn rot ("Mac-Teile noetig: <Datei>")
      - name: Waechter ohne Mac (ohne_mac.py)
        if: env.CI_STUFE == 'ohne-mac'
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin +refs/heads/main:refs/remotes/origin/main
          python -I werkzeuge/ci/ohne_mac.py selbsttest
          python -I werkzeuge/ci/ohne_mac.py pruefen
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pruefsummen (sha256sum)
        run: grep -v '^#' tests/Vergleich/SOLLWERTE.sha256 | sha256sum -c --strict --quiet -
      - name: Liste vollstaendig und Aenderungsnummer (sollwerte.py)
        run: python3 -I werkzeuge/vergleich/sollwerte.py pruefen
      # G52 haengt an den Inhalten in inhalte_csharp/lernen: das Werkzeug (ohne Python-Linie, liest die eingefrorene
      # tests/Vergleich/quiz_python.json) muss die gespeicherte Datei ergeben, bis auf die Zeile "python" (Fassung des
      # Interpreters, wie im frueheren Vergleich) Zeichen fuer Zeichen gleich. So faellt eine Inhalte-Aenderung ohne
      # neue G52 (Sollwert-Aenderung) sofort auf.
      - name: G52 gleich aus den Inhalten
        run: |
          python3 -I werkzeuge/vergleich/pruefe_lerninhalte.py . "$RUNNER_TEMP/lerninhalte_pruefung.json"
          python3 -I - "$RUNNER_TEMP/lerninhalte_pruefung.json" <<'PY'
          import json, sys
          alt = json.load(open("tests/Vergleich/lerninhalte_pruefung.json", encoding="utf-8"))
          neu = json.load(open(sys.argv[1], encoding="utf-8"))
          alt.pop("python"); neu.pop("python")
          assert json.dumps(alt, ensure_ascii=False, indent=1) == json.dumps(neu, ensure_ascii=False, indent=1), "G52 weicht ab: neue G52 ist eine Sollwert-Aenderung"
          print("G52 gleich")
          PY

  android:
    name: android (APK, nur arm64-v8a, Testsignatur)
    # nur Stufe voll; wartet auf pakete, weil es am Ende den Release-Entwurf zusammenstellt. Die APK
    # baut und prueft es auch bei rotem pakete-Teil (!cancelled), nur das Zusammenstellen braucht pakete gruen.
    # Phase 13 Welle 2: wartet auch auf das Werkzeug-Paket, um den Werkzeug-Release zusammenzustellen
    needs: [pakete, pakete-stadtbau]
    if: "!cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'voll' || github.event.label.name == 'werkzeug' || github.event.label.name == 'ohne-mac') && (((github.event_name == 'workflow_dispatch' && inputs.stufe == 'voll') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'voll'))) || ((github.event_name == 'workflow_dispatch' && inputs.stufe == 'ohne-mac') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ohne-mac') && !contains(github.event.pull_request.labels.*.name, 'voll'))) || ((github.event_name == 'workflow_dispatch' && inputs.stufe == 'werkzeug') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'werkzeug') && !contains(github.event.pull_request.labels.*.name, 'voll') && !contains(github.event.pull_request.labels.*.name, 'ohne-mac'))))"
    runs-on: ubuntu-latest
    # BEFRISTET bis 1.0 (Weisung P11-29/P11-30, Frage 3a): Schluessel fuer "Bericht senden" nur im Dispatch-Lauf
    # (Stufe voll), nie in PR-Laeufen; der Bau maskiert ihn (Lernplattform.Core.csproj), keine Ausgabe nennt ihn.
    env:
      FEHLERBERICHT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.FEHLERBERICHT_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7
      # Weisung P12-20: Waechter der Stufe werkzeug, erster Schritt; eine Datei ausserhalb des Werkzeugs macht ihn rot
      #   (Baum des Kopfs gegen origin/main; ein Lauf auf main selbst prueft den letzten Squash-Merge gegen den Commit davor)
      - uses: actions/setup-python@v7
        if: env.CI_STUFE == 'werkzeug' || env.CI_STUFE == 'ohne-mac'
        with:
          python-version: "3.12"
      - name: Waechter nur Werkzeug (nur_werkzeug.py)
        if: env.CI_STUFE == 'werkzeug'
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin +refs/heads/main:refs/remotes/origin/main
          python -I werkzeuge/stadtbau/nur_werkzeug.py selbsttest
          python -I werkzeuge/stadtbau/nur_werkzeug.py pruefen
      # Welle CI schneller 2 (Weisung P12-131, Nico Frage 2 = a): Waechter der Stufe ohne-mac; eine Datei, die die
      #   Mac-Teile noetig macht (Liste in werkzeuge/ci/ohne_mac.py), macht ihn rot ("Mac-Teile noetig: <Datei>")
      - name: Waechter ohne Mac (ohne_mac.py)
        if: env.CI_STUFE == 'ohne-mac'
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin +refs/heads/main:refs/remotes/origin/main
          python -I werkzeuge/ci/ohne_mac.py selbsttest
          python -I werkzeuge/ci/ohne_mac.py pruefen
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Android-Workload
        run: dotnet workload install android
      - name: APK bauen
        id: apkbau
        if: env.CI_STUFE != 'werkzeug'
        run: dotnet publish src/Lernplattform.Android -c Release -o apk
      # Spike D (A4b): zweite APK A 0.64.1 im selben Lauf, also mit demselben
      # Testschluessel; auf dem S24 als Update ueber A 0.64.0 installierbar.
      - name: Update-APK A 0.64.1 bauen
        if: env.CI_STUFE != 'werkzeug'
        run: dotnet publish src/Lernplattform.Android -c Release -p:Version=0.64.1 -o apk-update
      # Phase 7 W1 (Weisung P7-2, Frage 4a): Probe-APK der 3D-Stichprobe fuer Nicos S24 mit eigener
      # Kennung ...lernplattform.probe und Namen "Lernplattform Probe", Testschluessel dieses Laufs.
      - name: Probe-APK 3D-Stichprobe bauen
        if: env.CI_STUFE != 'werkzeug'
        run: dotnet publish src/Lernplattform.Android -c Release -p:Probe=true -o apk-probe
      - name: Probe-APK pruefen (eigene Kennung, Testschluessel, nie Release-Schluessel)
        if: env.CI_STUFE != 'werkzeug'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          a=$(ls apk-probe/*-Signed.apk)
          # erst in Dateien schreiben: head/grep -q beenden die Leitung frueh, mit pipefail waere das rot
          "$BT/aapt2" dump badging "$a" > probe_badging.txt
          head -n 1 probe_badging.txt
          head -n 1 probe_badging.txt | grep -q "name='io.github.papst2142cmd.lernplattform.probe'"
          grep -E "^(application-label|launchable-activity):" probe_badging.txt || true
          grep -q "^application-label:'Lernplattform Probe'" probe_badging.txt
          grep -q "^launchable-activity:.*label='Lernplattform Probe'" probe_badging.txt
          "$BT/apksigner" verify --print-certs "$a" > probe_zert.txt
          zert=$(grep "SHA-256" probe_zert.txt | head -n 1 | awk '{print $NF}')
          echo "Probe-Zertifikat SHA-256: $zert"
          release=$(grep -v '^#' werkzeuge/release/android_fingerabdruck.txt | tr -d ' \r\n')
          test -n "$zert"
          if [ "$zert" = "$release" ]; then echo "FEHLER: Probe-APK traegt den Release-Schluessel"; exit 1; fi
          for b in apk/*-Signed.apk; do
            "$BT/apksigner" verify --print-certs "$b" > test_zert.txt
            grep -q "SHA-256.*$zert" test_zert.txt || { echo "FEHLER: Probe-APK nicht mit dem Testschluessel dieses Laufs"; exit 1; }
          done
          # Phase 8 W8: die Abspiel-Bibliothek (Toene) steckt in jeder APK
          for b in "$a" apk/*-Signed.apk apk-update/*-Signed.apk; do
            unzip -l "$b" > app_inhalt.txt
            grep -q "lib/arm64-v8a/libminiaudio.so" app_inhalt.txt || { echo "FEHLER: $b ohne libminiaudio.so"; exit 1; }
          done
          mv "$a" apk-probe/Lernplattform-Probe-3D-arm64.apk
      - uses: actions/upload-artifact@v7
        if: env.CI_STUFE != 'werkzeug'
        with:
          name: lernplattform-probe-3d-android
          path: apk-probe/Lernplattform-Probe-3D-arm64.apk
          if-no-files-found: error
      - name: Versionscode und Schluessel pruefen
        if: env.CI_STUFE != 'werkzeug'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          for a in apk/*-Signed.apk apk-update/*-Signed.apk; do
            "$BT/aapt2" dump badging "$a" | head -n 1
            "$BT/apksigner" verify --print-certs "$a" | grep "SHA-256" | tee -a zertifikate.txt
          done
          # Phase 7 W1: die normale App behaelt ihre Kennung (die Probe-APK wird im selben Job gebaut)
          for a in apk/*-Signed.apk apk-update/*-Signed.apk; do
            "$BT/aapt2" dump badging "$a" > kennung.txt
            head -n 1 kennung.txt | grep -q "name='io.github.papst2142cmd.lernplattform' " || { echo "FEHLER: falsche Kennung in $a"; exit 1; }
            grep -q "^application-label:'Fachinformatiker Lernplattform'" kennung.txt || { echo "FEHLER: falscher App-Name in $a"; exit 1; }
          done
          "$BT/aapt2" dump badging apk/*-Signed.apk | head -n 1 | grep -q "versionCode='1006400'"
          "$BT/aapt2" dump badging apk-update/*-Signed.apk | head -n 1 | grep -q "versionCode='1006401'"
          test "$(sort -u zertifikate.txt | wc -l)" -eq 1
      - uses: actions/upload-artifact@v7
        if: env.CI_STUFE != 'werkzeug'
        with:
          name: lernplattform-android-A-0.64.0
          path: apk/*-Signed.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: env.CI_STUFE != 'werkzeug'
        with:
          name: updateprobe-android-A-0.64.1
          path: apk-update/*-Signed.apk
          if-no-files-found: error
      # Phase 6 W1 (VE1/VE3/VE4, T2): Release-APK mit Testschluessel (keine Geheimnisse im CI-Lauf),
      # dann alle fuenf Bauteile zusammenstellen und pruefen. Ergebnis nur als Artefakt, nichts hochgeladen.
      - name: Release-APK bauen (Testschluessel)
        if: env.CI_STUFE != 'werkzeug'
        env:
          PYTHON: python
        run: |
          bash werkzeuge/release/baue_release.sh android release
          # Phase 7 W1: Release-APK nie mit der Kennung der Probe (gleicher obj-Ordner wie der Probe-Bau)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          for a in release/release-android/*-android-arm64.apk; do
            "$BT/aapt2" dump badging "$a" > kennung_release.txt
            head -n 1 kennung_release.txt
            head -n 1 kennung_release.txt | grep -q "name='io.github.papst2142cmd.lernplattform' " || { echo "FEHLER: falsche Kennung in $a"; exit 1; }
            unzip -l "$a" > release_inhalt.txt
            grep -q "lib/arm64-v8a/libminiaudio.so" release_inhalt.txt || { echo "FEHLER: $a ohne libminiaudio.so (Toene)"; exit 1; }
          done
      # Welle CI schneller 2: der Release-Entwurf braucht alle vier Pakete, darum nur in der Stufe voll (ohne-mac hat keine
      #   Mac-Pakete; release.yml verlangt vor jedem Release ohnehin den vollen Lauf 17/17)
      - uses: actions/download-artifact@v8
        if: needs.pakete.result == 'success' && env.CI_STUFE == 'voll'
        with:
          pattern: release-*-*
          path: release
      - name: Release zusammenstellen und pruefen (T2, Lizenzliste)
        if: env.CI_STUFE == 'voll'
        run: |
          if [ "${{ needs.pakete.result }}" != "success" ]; then
            echo "FEHLER: pakete nicht gruen (${{ needs.pakete.result }}), kein Release-Entwurf"; exit 1
          fi
          ls -la release
          rc=0
          python -I werkzeuge/release/release.py zusammen release release/entwurf || rc=$?
          # Release-Text ins Protokoll (Entwurf fuer die Meldung, Artefakte sind nicht immer abrufbar)
          if [ -f release/release.md ]; then echo "===== ANFANG release.md ====="; cat release/release.md; echo "===== ENDE release.md ====="; fi
          exit "$rc"
      - uses: actions/upload-artifact@v7
        if: always() && env.CI_STUFE == 'voll'
        with:
          name: release-entwurf
          path: |
            release/entwurf/
            release/release.md
      # Phase 13 Welle 2 (Weisung P12-17): Tablet-APK des Werkzeugs (io.github.papst2142cmd.stadtbau, Testschluessel),
      # dann der Werkzeug-Release aus beiden Teilen (eigene Linie S, nie ein Feed oder Paket der Lernplattform)
      - name: Werkzeug-APK bauen (Testschluessel)
        id: werkzeug_apk
        # Stufe werkzeug (Weisung P12-20): ohne die Lernplattform-APKs davor, nur Werkzeug-APK und Werkzeug-Release
        if: "!cancelled() && (steps.apkbau.outcome == 'success' || env.CI_STUFE == 'werkzeug')"
        env:
          PYTHON: python
        run: bash werkzeuge/stadtbau/baue_stadtbau.sh android stadtbau
      - uses: actions/upload-artifact@v7
        if: "!cancelled() && steps.werkzeug_apk.outcome == 'success'"
        with:
          name: stadtbau-android-S-0.4.0
          path: stadtbau/stadtbau-android/
          if-no-files-found: error
      - uses: actions/download-artifact@v8
        if: "!cancelled() && needs.pakete-stadtbau.result == 'success' && steps.werkzeug_apk.outcome == 'success'"
        with:
          name: stadtbau-win-x64
          path: stadtbau/stadtbau-win-x64
      - name: Werkzeug-Release zusammenstellen und pruefen
        if: "!cancelled() && steps.werkzeug_apk.outcome == 'success'"
        run: |
          if [ "${{ needs.pakete-stadtbau.result }}" != "success" ]; then
            echo "FEHLER: pakete (stadtbau win-x64) nicht gruen (${{ needs.pakete-stadtbau.result }}), kein Werkzeug-Release"; exit 1
          fi
          python -I werkzeuge/stadtbau/stadtbau_release.py selbsttest
          python -I werkzeuge/stadtbau/stadtbau_release.py zusammen stadtbau stadtbau/entwurf
          echo "===== ANFANG release.md (Werkzeug) ====="; cat stadtbau/release.md; echo "===== ENDE release.md (Werkzeug) ====="
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stadtbau-release-entwurf
          path: |
            stadtbau/entwurf/
            stadtbau/release.md
          if-no-files-found: ignore
      # A 0.39.0 (Weisung P11-40 Frage 5a): Emulator-Probe des Updates im Programm (Android 14, x86_64). Drei
      # Probe-APKs n, n+1, n+2 (-p:UpdateProbe=true, nur hier, nie ausgeliefert) mit dem Testschluessel dieses Laufs;
      # die App sucht ueber einen Testserver auf dem Runner, laedt, prueft (Pruefsummen, Paket, Zertifikat, Versionscode)
      # und uebergibt an Android wie auf dem echten Handy. Haelt fest, ob Android nachfragt. Ablauf und Urteil:
      # werkzeuge/android/update_probe.sh. Kommt nach dem Release-Bau, damit dessen obj-Ordner unberuehrt bleibt.
      - name: Emulator-Probe Update, APKs bauen (x86_64, Testschluessel)
        id: probebau
        if: "!cancelled() && steps.apkbau.outcome == 'success'"
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          fp=$("$BT/apksigner" verify --print-certs apk/*-Signed.apk | grep "SHA-256" | head -n 1 | awk '{print $NF}')
          test -n "$fp"
          v=$(sed -nE 's:.*<Version>([0-9]+\.[0-9]+\.[0-9]+)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          basis=${v%.*}; fix=${v##*.}
          for i in 0 1 2; do
            dotnet publish src/Lernplattform.Android -c Release -p:UpdateProbe=true -p:Version=$basis.$((fix + i)) \
              -p:UpdateProbeUrl=http://10.0.2.2:8765/latest.json -p:UpdateProbeFingerabdruck=$fp -o updateprobe-$i
            "$BT/aapt2" dump badging updateprobe-$i/*-Signed.apk | head -n 1
          done
      # S 0.6.0 (Weisung P12-42 Punkt 2): Probe-APKs des Werkzeugs n, n+1 (-p:UpdateProbe=true, x86_64, Testschluessel
      # dieses Laufs, nie ausgeliefert), auch in der Stufe werkzeug; Ablauf und Urteil werkzeuge/stadtbau/update_probe.sh
      - name: Emulator-Probe Update Werkzeug, APKs bauen (x86_64, Testschluessel)
        id: probebau_stadtbau
        if: "!cancelled() && steps.werkzeug_apk.outcome == 'success'"
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          fp=$("$BT/apksigner" verify --print-certs stadtbau/stadtbau-android/*.apk | grep "SHA-256" | head -n 1 | awk '{print $NF}')
          test -n "$fp"
          v=$(sed -nE 's:.*<StadtbauVersion>([0-9]+\.[0-9]+\.[0-9]+)</StadtbauVersion>.*:\1:p' Directory.Build.props | head -n 1)
          test -n "$v"
          basis=${v%.*}; fix=${v##*.}
          for i in 0 1; do
            dotnet publish src/Stadtbau.Android -c Release -p:UpdateProbe=true -p:StadtbauVersion=$basis.$((fix + i)) \
              -p:UpdateProbeUrl=http://10.0.2.2:8766/releases.json -p:UpdateProbeFingerabdruck=$fp -o stadtbau-probe-$i
            "$BT/aapt2" dump badging stadtbau-probe-$i/*-Signed.apk | head -n 1
          done
      - name: Emulator-Probe Update, KVM freigeben
        if: "!cancelled() && (steps.probebau.outcome == 'success' || steps.probebau_stadtbau.outcome == 'success')"
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator-Probe Update (n -> n+1 -> n+2, Werkzeug n -> n+1, Android 14)
        if: "!cancelled() && (steps.probebau.outcome == 'success' || steps.probebau_stadtbau.outcome == 'success')"
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash werkzeuge/android/emulator_proben.sh ${{ steps.probebau.outcome }} ${{ steps.probebau_stadtbau.outcome }}
      - uses: actions/upload-artifact@v7
        if: "!cancelled() && steps.probebau.outcome == 'success'"
        with:
          name: emulator-probe-update
          path: emulator_probe_update.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: "!cancelled() && steps.probebau_stadtbau.outcome == 'success'"
        with:
          name: emulator-probe-stadtbau
          path: emulator_probe_stadtbau.txt
          if-no-files-found: warn

  urteil:
    # Welle CI schneller 2 (Meldung P12-84 Punkt 2, Nico Frage 1 = a, Weisung P12-131): liest am Ende des Laufs die Jobs und
    # die Protokolle der roten Jobs (nur Lesen) und sagt, ob ein Rot nur von GitHub kommt (kein Rechner, Abfragebremse,
    # 5xx, Netzfehler beim Hochladen, Jobs fehlen; Beleg im Protokoll des roten Schritts) oder echt ist. Bei "nur GitHub"
    # startet CC nur die roten Jobs neu (gleicher Lauf, gleicher Kopf, zaehlt nicht als Versuch); echte Rote bekommen den
    # ganzen Neustart, hoechstens 3 Versuche. Der Job ist immer gruen und nur ein Hinweis: release.yml und
    # stadtbau_release.yml zaehlen ihn nicht mit (Merge-Tor bleibt 17/17 bzw. die Liste der Stufe), urteil.py selbsttest
    # prueft das. Regeln und feste Faelle mit Gegenproben: werkzeuge/starttest/urteil_github.py.
    name: urteil (GitHub oder echt)
    needs: [tests, pakete, pakete-stadtbau, sollwerte, android]
    if: "!cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'voll' || github.event.label.name == 'werkzeug' || github.event.label.name == 'ohne-mac')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Urteil GitHub oder echt (urteil.py github)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I werkzeuge/starttest/urteil.py github
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: urteil-github-${{ github.run_attempt }}
          path: urteil_github.txt
          if-no-files-found: warn
