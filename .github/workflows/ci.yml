# Phase 0: Bauen und Testen auf jedem Push und Pull Request.
# Nur Leserechte; kein Release, kein Tag, keine Zugangsdaten.
#
# Zwei Stufen (Weisung P4-12, Nico 22.10.2026):
# - schnell: vergleichswerte und tests (ubuntu-latest) mit Start-Test und Python-Pruefungen.
#   Laeuft bei jedem Push auf einen Pull Request und auf main.
# - voll: dazu tests (windows-latest, macos-15), pakete x3 und android (8 Teile). Laeuft nur
#   ueber workflow_dispatch (Vorgabe voll) oder bei einem Pull Request mit dem Label "voll".
#   Der volle Lauf auf dem Kopf des Pull Requests ist das Merge-Tor.
# Phase 6 W1 (Weisung P6-2): im vollen Lauf bauen pakete x3 und android zusaetzlich die Release-Dateien
#   (werkzeuge/release/baue_release.sh, Android mit Testschluessel); android fuegt sie zum Artefakt
#   "release-entwurf" zusammen und prueft Lizenzliste und Pruefsummen (T2). Nichts wird hochgeladen;
#   das echte Release macht nur release.yml (nur von Hand, nur von main).
# Ein Label ausser "voll" startet nichts und bricht nichts ab (alle Teile uebersprungen).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      stufe:
        description: "Stufe: voll (alle 8 Teile) oder schnell"
        type: choice
        options: [voll, schnell]
        default: voll

permissions:
  contents: read

# B3: je Pull Request eine Gruppe, ein neuer Push bricht den alten Lauf ab. Laeufe auf main,
# ueber workflow_dispatch und Label ausser "voll" bekommen eine eigene Gruppe (nie abgebrochen).
concurrency:
  group: ${{ (github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name != 'voll')) && format('ci-{0}', github.run_id) || format('ci-pr-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  # Phase 8 W8 (Teilplan P8-15 4): Pruefstand stumm, der stille Tondienst zaehlt nur die Anlaesse
  LERNPLATTFORM_TON: "aus"

jobs:
  tests:
    name: tests (${{ matrix.os }})
    # schnell nur ubuntu-latest, voll alle drei Systeme
    if: (github.event.action != 'labeled' || github.event.label.name == 'voll')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.stufe != 'schnell') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'voll'))) && '["ubuntu-latest", "windows-latest", "macos-15"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Tests
        run: dotnet test --project tests/Lernplattform.Tests -c Release
      # Welle 4 (Weisung P2-11, R16/A3/A4/F5): Python 0.63.2 liest die Sicherungen fuer die
      # alte App, die der Test BelegDateienFuerPython eben geschrieben hat, und fuehrt sie zusammen
      - uses: actions/checkout@v7
        if: runner.os == 'Linux'
        with:
          repository: papst2142-cmd/Fisi-Lernplattform
          ref: v0.63.2
          path: python-linie
      # Python auf allen Systemen: Urteil des Start-Tests (werkzeuge/starttest/urteil.py, P4-13)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Phase 6 W1 (T1): Tag-Regel in Python gleich der C#-Regel (dieselben Faelle wie ReleaseTests)
      - name: Tag-Regel (release.py selbsttest)
        if: runner.os == 'Linux'
        run: python3 -I werkzeuge/release/release.py selbsttest
      - name: Sicherung fuer die alte App in Python 0.63.2 einlesen
        if: runner.os == 'Linux'
        run: python3 -I werkzeuge/vergleich/pruefe_ruecksicherung.py python-linie tests/Lernplattform.Tests/bin/Release/net10.0/beleg_ruecksicherung
      # Phase 4, W2: C#-Sicherung mit der Fachrichtung (zz-einstellungen) in Python 0.63.2 (+1 Projekt, dokumentiert)
      - name: Sicherung mit Fachrichtung in Python 0.63.2 einlesen
        if: runner.os == 'Linux'
        run: python3 -I werkzeuge/vergleich/pruefe_ausbildung.py python-linie tests/Lernplattform.Tests/bin/Release/net10.0/beleg_ausbildung
      # Phase 5, W1 (Plan Risiko 1): Stand nach "Alles ersetzen" der C#-Linie, unabhaengig mit Python 0.63.2 geprueft
      - name: Alles ersetzen mit Python 0.63.2 pruefen
        if: runner.os == 'Linux'
        run: python3 -I werkzeuge/vergleich/pruefe_wiederherstellung.py python-linie tests/Lernplattform.Tests/bin/Release/net10.0/beleg_wiederherstellung
      - name: Desktop bauen
        run: dotnet build src/Lernplattform.Desktop -c Release
      # Start ohne Bedienung (Phase 1): jede Seite oeffnen, Hell/Dunkel und Schriftstufen
      # wechseln, Layoutpruefung breit und schmal (384 x 832). Rot bei Absturz, bei einem
      # Wert ueber 1000 ms oder einem Layoutfund (Rueckgabe 3). Ueberschreitet ein
      # wiederholbarer Messpunkt seine Grenze, misst der Start-Test ihn bis zu 3 Mal (P4-12 B6).
      # Neustart-Regel (Weisung P4-13): Rueckgabe 3 im 1. Lauf -> 2. Lauf in neuem Prozess mit
      # frischem Datenordner; rot nur, wenn derselbe Messpunkt in beiden Laeufen rot ist.
      # Absturz (andere Rueckgabe, Ausnahme, keine Messdatei) startet nicht neu und ist rot.
      # Wachhund je Lauf 15 Minuten (vorher 10): mit den Spielansichten aus Phase 7 braucht ein
      # gesunder Lauf auf Windows und macOS 9,5 bis 10 Minuten (P7-13a); die Messgrenzen bleiben.
      # Sammelliste 106 (Weisung P8-2): Lernteil und Spielansichten als eigene Schritte, jeder mit
      # eigenem Wachhund, eigener Neustart-Regel und eigenen Messdateien. Weisung P8-3 (E2 Chat):
      # Spielschritte 10 Minuten (Lauf 40326477854: hoechstens 64 s); die Lernschritte bleiben bei
      # 15 Minuten, bis ein zweiter voller Lauf alle unter 9 Minuten zeigt (dann W3).
      # Weisung P8-5 (W3): Lauf 40351299271 zeigte ubuntu 476 s, windows 540 s, macOS 594 s, nicht
      # alle unter 540 s; darum bleiben die Lernschritte bei 15 Minuten.
      - name: Start ohne Bedienung (1. Lauf)
        id: lauf1
        timeout-minutes: 15
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: lernen
        run: bash werkzeuge/starttest/lauf.sh 1 messung_${{ runner.os }}_lauf1_versuch${{ github.run_attempt }}.txt
      - name: Start ohne Bedienung (2. Lauf, neuer Prozess, frischer Datenordner)
        if: steps.lauf1.outputs.rc == '3'
        timeout-minutes: 15
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: lernen
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_lauf2
        run: bash werkzeuge/starttest/lauf.sh 2 messung_${{ runner.os }}_lauf2_versuch${{ github.run_attempt }}.txt messung_${{ runner.os }}_lauf1_versuch${{ github.run_attempt }}.txt
      - name: Spielansichten ohne Bedienung (1. Lauf, frischer Datenordner)
        id: spiel1
        if: always() && steps.lauf1.outcome != 'skipped'
        timeout-minutes: 10
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: spiel
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_spiel1
        run: bash werkzeuge/starttest/lauf.sh 1 messung_${{ runner.os }}_spiel1_versuch${{ github.run_attempt }}.txt
      - name: Spielansichten ohne Bedienung (2. Lauf, neuer Prozess, frischer Datenordner)
        if: always() && steps.spiel1.outputs.rc == '3'
        timeout-minutes: 10
        shell: bash
        env:
          LERNPLATTFORM_MESSUNG_TEIL: spiel
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_spiel2
        run: bash werkzeuge/starttest/lauf.sh 2 messung_${{ runner.os }}_spiel2_versuch${{ github.run_attempt }}.txt messung_${{ runner.os }}_spiel1_versuch${{ github.run_attempt }}.txt
      # Phase 7 W1 (Plan Abschnitt 4): eigener kurzer Lauf ohne OpenGL (--software, nur Windows und Linux;
      # macOS hat keinen Software-Schalter). Erwartet: Hinweis und Ortsliste, kein Absturz, Urteil gruen.
      - name: Spiel ohne OpenGL (kurzer Lauf mit Zeichnen in Software)
        if: always() && runner.os != 'macOS' && steps.lauf1.outcome != 'skipped'
        timeout-minutes: 5
        shell: bash
        env:
          LERNPLATTFORM_SOFTWARE: "1"
          LERNPLATTFORM_MESSUNG_TEIL: spiel-ersatz
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_ersatz
        run: |
          datei=messung_${{ runner.os }}_ersatz_versuch${{ github.run_attempt }}.txt
          bash werkzeuge/starttest/lauf.sh 1 "$datei" || true
          cat "$datei" || true
          grep -q "^URTEIL: gruen" "$datei" || { echo "FEHLER: Spiel ohne OpenGL nicht gruen"; exit 1; }
      # Phase 7 W1, nur Messung fuer Nicos Entscheidung (Plan Abschnitt 3, Weg 1): ganzer Start-Test auf
      # macOS mit OpenGL statt Metal. Aendert kein Urteil dieses Jobs (das faellt allein im Standard-Zeichenweg).
      - name: Nur Messung macOS mit OpenGL statt Metal (Weg 1, ohne Urteil)
        if: always() && runner.os == 'macOS' && steps.lauf1.outcome != 'skipped'
        timeout-minutes: 12
        shell: bash
        env:
          LERNPLATTFORM_MAC_OPENGL: "1"
          LERNPLATTFORM_DATEN: ${{ runner.temp }}/daten_mac_opengl
        run: |
          datei=messung_${{ runner.os }}_macopengl_versuch${{ github.run_attempt }}.txt
          GITHUB_OUTPUT=/dev/null bash werkzeuge/starttest/lauf.sh 1 "$datei" || true
          grep -E "^(Schalter|Spiel|URTEIL)|FEHLER" "$datei" || true
      - uses: actions/upload-artifact@v7
        with:
          name: messung-${{ runner.os }}-${{ github.run_attempt }}
          path: messung_${{ runner.os }}_*_versuch${{ github.run_attempt }}.txt
        if: always()
      # Sicherungsschritt (Weisung P4-14 c): 1. Lauf ohne Fehler, aber Rueckgabe weder 0 noch 3
      # (leer, mit \r, verlorene Ausgabe) -> rot. Ein verschwiegenes Rot darf nie gruen enden.
      - name: Start-Test Rueckgabe pruefen
        if: always() && steps.lauf1.outcome == 'success' && steps.lauf1.outputs.rc != '0' && steps.lauf1.outputs.rc != '3'
        shell: bash
        run: |
          echo "Rueckgabe des 1. Laufs unbekannt, kein Urteil moeglich (Ausgabe rc: '${{ steps.lauf1.outputs.rc }}')"
          exit 1
      - name: Spielansichten Rueckgabe pruefen
        if: always() && steps.spiel1.outcome == 'success' && steps.spiel1.outputs.rc != '0' && steps.spiel1.outputs.rc != '3'
        shell: bash
        run: |
          echo "Rueckgabe des 1. Laufs der Spielansichten unbekannt, kein Urteil moeglich (Ausgabe rc: '${{ steps.spiel1.outputs.rc }}')"
          exit 1

  pakete:
    # Spike D: Pakete mit Velopack (Windows-Setup, Linux-AppImage, macOS) und
    # Update-Probe A 0.23.0 -> A 0.23.1 -> B 0.1.0, Rueckschritt muss abgelehnt werden.
    name: pakete (${{ matrix.rid }})
    # nur Stufe voll
    if: (github.event.action != 'labeled' || github.event.label.name == 'voll') && ((github.event_name == 'workflow_dispatch' && inputs.stufe != 'schnell') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'voll')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    # Phase 6 W1: 30 -> 45 Minuten, weil der Release-Bau (zweites publish und pack) dazukommt
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Werkzeuge
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y -q squashfs-tools; fi
      - name: Pakete bauen und Update pruefen
        shell: bash
        env:
          PYTHON: python
        run: bash werkzeuge/pakete/pakete_und_update.sh ${{ matrix.rid }} pakete
      - uses: actions/upload-artifact@v7
        with:
          name: paket-${{ matrix.rid }}-A-0.23.0
          path: pakete/feed-A-0.23.0/
      - uses: actions/upload-artifact@v7
        with:
          name: updateprobe-${{ matrix.rid }}-A-0.23.1
          path: pakete/feed-A-0.23.1/
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: appimage-linux-x64-A-0.23.0-tar
          path: pakete/appimage/
      # Phase 6 W1 (VE1/VE4): Release-Dateien aus dem Stand im Repo, jede Datei in der Lizenzliste
      - name: Release-Dateien bauen (ohne Hochladen)
        shell: bash
        env:
          PYTHON: python
        run: bash werkzeuge/release/baue_release.sh ${{ matrix.rid }} release
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: release/release-${{ matrix.rid }}/
          if-no-files-found: error

  vergleichswerte:
    # Erzeugt die Vergleichswerte mit Python 3.12 (wie die Python-Linie) aus
    # dem eingefrorenen Stand v0.63.2 neu und prueft, dass sie gleich sind.
    name: vergleichswerte (Python 3.12)
    if: (github.event.action != 'labeled' || github.event.label.name == 'voll')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: papst2142-cmd/Fisi-Lernplattform
          ref: v0.63.2
          path: python-linie
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inhalte gleich wie v0.63.2
        run: diff -r python-linie/inhalte inhalte
      - name: Zufall und Inhalte neu erzeugen
        run: |
          mkdir -p neu
          python3 -I werkzeuge/vergleich/erzeuge_zufall.py python-linie neu/zufall.json
          python3 -I werkzeuge/vergleich/erzeuge_daten.py python-linie inhalte neu
          python3 -I werkzeuge/vergleich/erzeuge_farbwelten.py python-linie neu/farbwelten.json
          # Phase 1 (Weisung P1-2): G10 Fehlerprotokoll, G11 Datenbank/Einstellungen, G12 Inhalte-Pruefung
          python3 -I werkzeuge/vergleich/erzeuge_fehlerprotokoll.py python-linie neu/fehlerprotokoll.json
          python3 -I werkzeuge/vergleich/erzeuge_datenbank.py python-linie neu/datenbank.json
          python3 -I werkzeuge/vergleich/erzeuge_inhalte_pruefung.py python-linie inhalte neu/inhalte_pruefung.json
          # Welle 2: G6b eigene Farben, G9 Beschriftungen, G13 Dashboard
          python3 -I werkzeuge/vergleich/erzeuge_eigene_farben.py python-linie neu/eigene_farben.json
          python3 -I werkzeuge/vergleich/erzeuge_beschriftungen.py python-linie neu/beschriftungen.json
          python3 -I werkzeuge/vergleich/erzeuge_dashboard.py python-linie tests/Vergleich/testdaten.db neu/dashboard.json
          # G14 Potenz x ** y wie Python unter Linux (Core/Mathe/PythonPow)
          python3 -I werkzeuge/vergleich/erzeuge_potenz.py neu/potenz.json
          # Phase 2 Welle 1 (Weisung P2-2): G15 Wiederholung, G16 Reihenfolge, G17 Trainer/Speichern,
          # G20 Uebernahme; Erzeuger fuer den Pruefsummen-Sonderfall (Sammelliste 15)
          python3 -I werkzeuge/vergleich/erzeuge_wiederholung.py python-linie tests/Vergleich/testdaten.db neu/wiederholung.json
          python3 -I werkzeuge/vergleich/erzeuge_reihenfolge.py python-linie neu/reihenfolge.json
          python3 -I werkzeuge/vergleich/erzeuge_trainer.py python-linie neu/trainer.json
          python3 -I werkzeuge/vergleich/erzeuge_uebernahme.py python-linie neu/uebernahme.json
          python3 -I werkzeuge/vergleich/erzeuge_pruefsumme_sonderfall.py python-linie neu/pruefsumme_sonderfall.json
          # Phase 2 Welle 2 (Weisung P2-4): G22 Texte der Karteikarten, des Pruefungstrainers und der Uebernahme
          python3 -I werkzeuge/vergleich/erzeuge_lerntexte.py python-linie tests/Vergleich/uebernahme.json neu/lerntexte.json
          # Phase 2 Welle 3 (Weisung P2-7): G18 Fortschritt (L7), G19 Suche (L8) und die Tabelle fuer
          # Pythons str.lower() (Core/Suche/PythonKlein.Tabelle.cs, muss bytegleich neu entstehen)
          python3 -I werkzeuge/vergleich/erzeuge_auswertung.py python-linie tests/Vergleich/testdaten.db neu/auswertung.json
          python3 -I werkzeuge/vergleich/erzeuge_suche.py python-linie neu/suche.json
          python3 -I werkzeuge/tabellen/erzeuge_python_klein.py neu/PythonKlein.Tabelle.cs
          # Phase 2 Welle 4 (Weisung P2-11): G21 Abgleich (ein Versuch ohne Netz) und Sicherung fuer die alte App
          python3 -I werkzeuge/vergleich/erzeuge_abgleich.py python-linie neu/abgleich.json
          # Phase 2 Welle 5 (Weisung P2-14 A5): G23 Reglerspur der eigenen Farben
          python3 -I werkzeuge/vergleich/erzeuge_reglerspur.py python-linie neu/reglerspur.json
          # Phase 3 Welle 1 (Weisung P3-2): G24 Zahlen und Zeilen, G25 Subnetting, G26 RAID/Bildschirm/USV;
          # die Tabellen fuer Pythons Textregeln und die Rechner-Texte muessen bytegleich neu entstehen
          python3 -I werkzeuge/vergleich/erzeuge_rechner_zahlen.py python-linie neu/rechner_zahlen.json
          python3 -I werkzeuge/vergleich/erzeuge_subnetting.py python-linie neu/subnetting.json
          python3 -I werkzeuge/vergleich/erzeuge_rechner.py python-linie neu/rechner.json
          # Phase 3 Welle 3 (Weisung P3-10): G27 Rechen-Trainer
          python3 -I werkzeuge/vergleich/erzeuge_rechentrainer.py python-linie neu/rechentrainer.json
          # Phase 3 W4a (Weisungen P3-16/P3-17): G28 Datenmengen und Uebertragungsdauer, G31 Trainer einheiten/dauer,
          # unabhaengige Skripte ohne Python-Linie
          python3 -I werkzeuge/vergleich/erzeuge_w4_datenmengen.py neu/datenmengen.json
          python3 -I werkzeuge/vergleich/erzeuge_w4_rechentrainer.py neu/rechentrainer_w4.json
          # Phase 3 W4b (Weisung P3-20): G29 Bild und Video mit Uebernahme, unabhaengiges Skript
          python3 -I werkzeuge/vergleich/erzeuge_w4_video.py neu/video.json
          # Phase 3 W4c (Weisung P3-22): G30 WiSo-Rechner, unabhaengiges Skript
          python3 -I werkzeuge/vergleich/erzeuge_w4_wiso.py neu/wiso.json
          # Phase 4 W1 (Weisung P4-3): G33 Notizblock und Listen, G34 Abschlussprojekt (Teil speichern)
          python3 -I werkzeuge/vergleich/erzeuge_notizblock.py python-linie tests/Vergleich/testdaten.db neu/notizblock.json
          python3 -I werkzeuge/vergleich/erzeuge_abschlussprojekt.py python-linie neu/abschlussprojekt.json
          # Phase 4 W2 (Weisung P4-6): G32 Klausur aus Python, G36 Fachrichtungen (unabhaengiges Skript)
          python3 -I werkzeuge/vergleich/erzeuge_pruefung.py python-linie neu/pruefung.json
          python3 -I werkzeuge/vergleich/erzeuge_fachrichtungen.py inhalte neu/fachrichtungen.json
          python3 -I werkzeuge/tabellen/erzeuge_python_zeichen.py neu/PythonZeichen.Tabelle.cs
          python3 -I werkzeuge/tabellen/erzeuge_rechner_texte.py python-linie neu/RechnerTexte.Python.cs
          # Phase 4 W3 (Weisung P4-8): Zeichentabelle des PDF-Exports und G34 aus dem unabhaengigen Skript
          python3 -I werkzeuge/tabellen/erzeuge_pdf_zeichen.py python-linie neu/PdfZeichen.Tabelle.cs
          python3 -I werkzeuge/vergleich/pruefe_abschlussprojekt.py inhalte neu/abschlussprojekt_skript.json
          # Phase 4 W4 (Weisung P4-10/P4-11): G35 Hilfe aus Python und aus dem unabhaengigen Skript
          python3 -I werkzeuge/vergleich/erzeuge_hilfe.py python-linie neu/hilfe.json
          python3 -I werkzeuge/vergleich/pruefe_hilfe.py neu/hilfe_skript.json
          # Phase 5 W1 (Weisung P5-3): G37 Alles ersetzen und Zusammenfuehren, G40 Loeschen und Marke mit Uhrabweichung
          python3 -I werkzeuge/vergleich/erzeuge_sicherung_ersetzen.py python-linie tests/Vergleich/uebernahme.json neu/sicherung_ersetzen.json
          python3 -I werkzeuge/vergleich/erzeuge_loeschen.py python-linie tests/Vergleich/uebernahme.json neu/loeschen.json
          # Phase 5 W2 (Weisung P5-6): G38 Problembericht, G39 Leistungsmessung
          python3 -I werkzeuge/vergleich/erzeuge_problembericht.py python-linie neu/problembericht.json
          python3 -I werkzeuge/vergleich/erzeuge_leistungsmessung.py python-linie neu/leistungsmessung.json
          # Phase 5 W3 (Weisung P5-8): G41 Update (fisi_update.py)
          python3 -I werkzeuge/vergleich/erzeuge_update.py python-linie neu/update.json
          # Phase 7 W2: Spiel-Kern (G42 Spielinhalte)
          python3 -I werkzeuge/vergleich/erzeuge_spiel_inhalte.py python-linie neu/spiel_inhalte.json
          python3 -I werkzeuge/vergleich/erzeuge_spiel_wege.py python-linie neu/spiel_wege.json
          python3 -I werkzeuge/vergleich/erzeuge_spiel_neuaufbau.py python-linie neu/spiel_neuaufbau.json
          python3 -I werkzeuge/vergleich/erzeuge_spiel_tickets.py python-linie neu/spiel_tickets.json
          python3 -I werkzeuge/vergleich/erzeuge_spiel_bewertung.py python-linie neu/spiel_bewertung.json
          python3 -I werkzeuge/vergleich/erzeuge_spiel_texte.py python-linie neu/spiel_texte.json
          python3 -I werkzeuge/vergleich/erzeuge_spiel_aktionen.py python-linie neu/spiel_aktionen.json
          python3 -I werkzeuge/vergleich/erzeuge_spiel_pruefung.py python-linie neu/spiel_pruefung.json
          python3 -I werkzeuge/vergleich/erzeuge_spiel_plaetze.py python-linie neu/spiel_plaetze.json
          # Phase 7 W3 (Weisung P7-4): G43 Spielwerte-Fingerabdruck f2b59ce8, G47 Firma
          python3 -I werkzeuge/vergleich/erzeuge_spiel_fingerabdruck.py python-linie neu/spiel_fingerabdruck.json
          python3 -I werkzeuge/vergleich/erzeuge_spiel_firma.py python-linie neu/spiel_firma.json
          # Phase 7 W8 (Weisung P7-5): G44 Spielstand aus einer echten Python-Datenbank ueber die Uebernahme
          python3 -I werkzeuge/vergleich/erzeuge_spiel_uebernahme.py python-linie neu/spiel_uebernahme.json
          # Phase 7 (Weisung P7-6): G44 Platzverwaltung (Sammelliste 94), G48 Orte der Stadt-Karte
          python3 -I werkzeuge/vergleich/erzeuge_spiel_verwaltung.py python-linie neu/spiel_verwaltung.json
          python3 -I werkzeuge/vergleich/erzeuge_spiel_stadt.py python-linie neu/spiel_stadt.json
          # Phase 7 W5 (Weisung P7-10): G49 Innenraeume (Grundriss, Personen, Texte, Moebel-Vorschau) auf den Staenden von G44/G47
          python3 -I werkzeuge/vergleich/erzeuge_spiel_orte.py python-linie neu/spiel_aktionen.json neu/spiel_firma.json neu/spiel_orte.json
          # Phase 7 W6 (Weisung P7-11): G50 Spiel-Ansichten (Rueckmeldungen, Rack-Balken, Formular, Ersatzteile, Wissen, Figur)
          python3 -I werkzeuge/vergleich/erzeuge_spiel_ansichten.py python-linie neu/spiel_ansichten.json
          # Phase 8 W3 (Weisung P8-5): G51 Spiel-Abgleich (drei Geraete offline, fisi_sync ohne Netz, Neuaufbau)
          python3 -I werkzeuge/vergleich/erzeuge_spiel_abgleich.py python-linie neu/spiel_abgleich.json
          diff src/Lernplattform.Core/Suche/PythonKlein.Tabelle.cs neu/PythonKlein.Tabelle.cs
          diff src/Lernplattform.Core/Rechner/PythonZeichen.Tabelle.cs neu/PythonZeichen.Tabelle.cs
          diff src/Lernplattform.Core/Texte/RechnerTexte.Python.cs neu/RechnerTexte.Python.cs
          diff src/Lernplattform.Core/Projekt/PdfZeichen.Tabelle.cs neu/PdfZeichen.Tabelle.cs
      - name: Vergleich
        run: |
          python3 -I - <<'PY'
          import json
          for name in ("zufall.json", "inhalte.json", "testdaten.json", "farbwelten.json",
                       "fehlerprotokoll.json", "datenbank.json", "inhalte_pruefung.json",
                       "eigene_farben.json", "beschriftungen.json", "dashboard.json",
                       "potenz.json", "wiederholung.json", "reihenfolge.json", "trainer.json",
                       "uebernahme.json", "pruefsumme_sonderfall.json", "lerntexte.json",
                       "auswertung.json", "suche.json", "abgleich.json", "reglerspur.json",
                       "rechner_zahlen.json", "subnetting.json", "rechner.json",
                       "rechentrainer.json", "datenmengen.json", "rechentrainer_w4.json",
                       "video.json", "wiso.json", "notizblock.json", "abschlussprojekt.json",
                       "pruefung.json", "fachrichtungen.json", "hilfe.json",
                       "sicherung_ersetzen.json", "loeschen.json", "problembericht.json",
                       "leistungsmessung.json", "update.json", "spiel_inhalte.json", "spiel_wege.json",
                       "spiel_neuaufbau.json", "spiel_tickets.json", "spiel_bewertung.json",
                       "spiel_texte.json", "spiel_aktionen.json", "spiel_pruefung.json",
                       "spiel_plaetze.json", "spiel_fingerabdruck.json", "spiel_firma.json",
                       "spiel_uebernahme.json", "spiel_verwaltung.json", "spiel_stadt.json",
                       "spiel_orte.json", "spiel_ansichten.json", "spiel_abgleich.json"):
              alt = json.load(open("tests/Vergleich/" + name, encoding="utf-8"))
              neu = json.load(open("neu/" + name, encoding="utf-8"))
              alt.pop("python", None); neu.pop("python", None)
              assert alt == neu, name + " weicht ab"
              if name.startswith("spiel_"):  # streng: 1 und 1.0 sind fuer C# verschieden
                  assert json.dumps(alt) == json.dumps(neu), name + " weicht ab (Zahlart)"
              print(name, "gleich")
          # G36 (Skript nur aus der Spezifikation) muss bei SI gleich G32 (Python) sein
          g32 = json.load(open("neu/pruefung.json", encoding="utf-8"))
          g36 = json.load(open("neu/fachrichtungen.json", encoding="utf-8"))
          for a, b in zip(g32["kriterien"]["szenarien"], g36["kriterien"], strict=True):
              assert [a["quelle"], a["index"], a["teile"] is not None] == b[:3], (a["quelle"], a["index"])
              if a["teile"] is not None:
                  assert [a["teile"]["einleitung"], a["teile"]["teile"]] == b[3:], (a["quelle"], a["index"])
          for a, b in zip(g32["gesamt"]["faelle"], g36["gesamt"], strict=True):
              assert a[:6] == b[:6], a[0]
          si = [f for f in g32["gesamt"]["faelle"] if not f[4]]
          texte = {tuple(t[0]): t for t in g36["texte"]["si"]}
          for f in si:
              if tuple(f[0]) in texte:
                  assert texte[tuple(f[0])][2] == f[7] and texte[tuple(f[0])][1][2] == f[6], f[0]
          assert [t[1] for t in g32["kriterien"]["teilpunkte"]] == [t[1] for t in g36["teilpunkte"]]
          print("G36 SI gleich G32")
          # G34 (W3): das Skript nur aus der Spezifikation muss in allen seinen Teilen gleich Python sein
          g34 = json.load(open("neu/abschlussprojekt.json", encoding="utf-8"))
          skript = json.load(open("neu/abschlussprojekt_skript.json", encoding="utf-8"))
          teile = ("zahl", "rechnen", "export", "projekte", "fragen", "rueckfrage", "pdf", "texte", "grenze")
          assert sorted(skript) == sorted(teile), sorted(skript)
          for teil in teile:
              assert skript[teil] == g34[teil], "G34 " + teil + ": Skript weicht von Python ab"
          print("G34 Skript gleich Python")
          # G35 (W4): das Skript nur aus der Spezifikation muss in allen Teilen gleich Python sein
          g35 = json.load(open("neu/hilfe.json", encoding="utf-8"))
          skript = json.load(open("neu/hilfe_skript.json", encoding="utf-8"))
          teile = ("texte", "datum", "suche", "name", "einstellungen", "rundgang", "oberflaeche", "paare")
          assert sorted(skript) == sorted(teile), sorted(skript)
          for teil in teile:
              assert skript[teil] == g35[teil], "G35 " + teil + ": Skript weicht von Python ab"
          print("G35 Skript gleich Python")
          PY

  android:
    name: android (APK, nur arm64-v8a, Testsignatur)
    # nur Stufe voll; wartet auf pakete, weil es am Ende den Release-Entwurf zusammenstellt. Die APK
    # baut und prueft es auch bei rotem pakete-Teil (!cancelled), nur das Zusammenstellen braucht pakete gruen.
    needs: pakete
    if: "!cancelled() && ((github.event.action != 'labeled' || github.event.label.name == 'voll') && ((github.event_name == 'workflow_dispatch' && inputs.stufe != 'schnell') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'voll'))))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Android-Workload
        run: dotnet workload install android
      - name: APK bauen
        run: dotnet publish src/Lernplattform.Android -c Release -o apk
      # Spike D (A4b): zweite APK A 0.23.1 im selben Lauf, also mit demselben
      # Testschluessel; auf dem S24 als Update ueber A 0.23.0 installierbar.
      - name: Update-APK A 0.23.1 bauen
        run: dotnet publish src/Lernplattform.Android -c Release -p:Version=0.23.1 -o apk-update
      # Phase 7 W1 (Weisung P7-2, Frage 4a): Probe-APK der 3D-Stichprobe fuer Nicos S24 mit eigener
      # Kennung ...lernplattform.probe und Namen "Lernplattform Probe", Testschluessel dieses Laufs.
      - name: Probe-APK 3D-Stichprobe bauen
        run: dotnet publish src/Lernplattform.Android -c Release -p:Probe=true -o apk-probe
      - name: Probe-APK pruefen (eigene Kennung, Testschluessel, nie Release-Schluessel)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          a=$(ls apk-probe/*-Signed.apk)
          # erst in Dateien schreiben: head/grep -q beenden die Leitung frueh, mit pipefail waere das rot
          "$BT/aapt2" dump badging "$a" > probe_badging.txt
          head -n 1 probe_badging.txt
          head -n 1 probe_badging.txt | grep -q "name='io.github.papst2142cmd.lernplattform.probe'"
          grep -E "^(application-label|launchable-activity):" probe_badging.txt || true
          grep -q "^application-label:'Lernplattform Probe'" probe_badging.txt
          grep -q "^launchable-activity:.*label='Lernplattform Probe'" probe_badging.txt
          "$BT/apksigner" verify --print-certs "$a" > probe_zert.txt
          zert=$(grep "SHA-256" probe_zert.txt | head -n 1 | awk '{print $NF}')
          echo "Probe-Zertifikat SHA-256: $zert"
          release=$(grep -v '^#' werkzeuge/release/android_fingerabdruck.txt | tr -d ' \r\n')
          test -n "$zert"
          if [ "$zert" = "$release" ]; then echo "FEHLER: Probe-APK traegt den Release-Schluessel"; exit 1; fi
          for b in apk/*-Signed.apk; do
            "$BT/apksigner" verify --print-certs "$b" > test_zert.txt
            grep -q "SHA-256.*$zert" test_zert.txt || { echo "FEHLER: Probe-APK nicht mit dem Testschluessel dieses Laufs"; exit 1; }
          done
          # Phase 8 W8: die Abspiel-Bibliothek (Toene) steckt in jeder APK
          for b in "$a" apk/*-Signed.apk apk-update/*-Signed.apk; do
            unzip -l "$b" > app_inhalt.txt
            grep -q "lib/arm64-v8a/libminiaudio.so" app_inhalt.txt || { echo "FEHLER: $b ohne libminiaudio.so"; exit 1; }
          done
          mv "$a" apk-probe/Lernplattform-Probe-3D-arm64.apk
      - uses: actions/upload-artifact@v7
        with:
          name: lernplattform-probe-3d-android
          path: apk-probe/Lernplattform-Probe-3D-arm64.apk
          if-no-files-found: error
      - name: Versionscode und Schluessel pruefen
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          for a in apk/*-Signed.apk apk-update/*-Signed.apk; do
            "$BT/aapt2" dump badging "$a" | head -n 1
            "$BT/apksigner" verify --print-certs "$a" | grep "SHA-256" | tee -a zertifikate.txt
          done
          # Phase 7 W1: die normale App behaelt ihre Kennung (die Probe-APK wird im selben Job gebaut)
          for a in apk/*-Signed.apk apk-update/*-Signed.apk; do
            "$BT/aapt2" dump badging "$a" > kennung.txt
            head -n 1 kennung.txt | grep -q "name='io.github.papst2142cmd.lernplattform' " || { echo "FEHLER: falsche Kennung in $a"; exit 1; }
            grep -q "^application-label:'Fachinformatiker Lernplattform'" kennung.txt || { echo "FEHLER: falscher App-Name in $a"; exit 1; }
          done
          "$BT/aapt2" dump badging apk/*-Signed.apk | head -n 1 | grep -q "versionCode='1002300'"
          "$BT/aapt2" dump badging apk-update/*-Signed.apk | head -n 1 | grep -q "versionCode='1002301'"
          test "$(sort -u zertifikate.txt | wc -l)" -eq 1
      - uses: actions/upload-artifact@v7
        with:
          name: lernplattform-android-A-0.23.0
          path: apk/*-Signed.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: updateprobe-android-A-0.23.1
          path: apk-update/*-Signed.apk
          if-no-files-found: error
      # Phase 6 W1 (VE1/VE3/VE4, T2): Release-APK mit Testschluessel (keine Geheimnisse im CI-Lauf),
      # dann alle vier Bauteile zusammenstellen und pruefen. Ergebnis nur als Artefakt, nichts hochgeladen.
      - name: Release-APK bauen (Testschluessel)
        env:
          PYTHON: python
        run: |
          bash werkzeuge/release/baue_release.sh android release
          # Phase 7 W1: Release-APK nie mit der Kennung der Probe (gleicher obj-Ordner wie der Probe-Bau)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          for a in release/release-android/*-android-arm64.apk; do
            "$BT/aapt2" dump badging "$a" > kennung_release.txt
            head -n 1 kennung_release.txt
            head -n 1 kennung_release.txt | grep -q "name='io.github.papst2142cmd.lernplattform' " || { echo "FEHLER: falsche Kennung in $a"; exit 1; }
            unzip -l "$a" > release_inhalt.txt
            grep -q "lib/arm64-v8a/libminiaudio.so" release_inhalt.txt || { echo "FEHLER: $a ohne libminiaudio.so (Toene)"; exit 1; }
          done
      - uses: actions/download-artifact@v8
        if: needs.pakete.result == 'success'
        with:
          pattern: release-*-*
          path: release
      - name: Release zusammenstellen und pruefen (T2, Lizenzliste)
        run: |
          if [ "${{ needs.pakete.result }}" != "success" ]; then
            echo "FEHLER: pakete nicht gruen (${{ needs.pakete.result }}), kein Release-Entwurf"; exit 1
          fi
          ls -la release
          rc=0
          python -I werkzeuge/release/release.py zusammen release release/entwurf || rc=$?
          # Release-Text ins Protokoll (Entwurf fuer die Meldung, Artefakte sind nicht immer abrufbar)
          if [ -f release/release.md ]; then echo "===== ANFANG release.md ====="; cat release/release.md; echo "===== ENDE release.md ====="; fi
          exit "$rc"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-entwurf
          path: |
            release/entwurf/
            release/release.md
