# Phase 11 W3 (Weisung P11-21): voruebergehende Probe, ob der Windows-Runner Aufloesung und Skalierung
# 150 % zulaesst. Nur Lesen und Anzeigeeinstellung des Runners, kein Bau, kein Hochladen. Wird vor dem
# fertigen Kopf wieder entfernt.
name: Probe Skalierung
on:
  push:
    branches: [claude/project-thread-93wmxf]
    paths: [".github/workflows/probe_skalierung.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Anzeige lesen, Aufloesung und Skalierung setzen, wieder lesen
        shell: pwsh
        run: |
          $code = @'
          using System;
          using System.Runtime.InteropServices;
          public static class Anz {
            [DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint a, uint b, ref int c, uint d);
            [DllImport("user32.dll", EntryPoint="SystemParametersInfo")] public static extern bool Spi(uint a, int b, IntPtr c, uint d);
            [DllImport("user32.dll")] public static extern IntPtr SetProcessDpiAwarenessContext(IntPtr v);
            [DllImport("user32.dll")] public static extern IntPtr MonitorFromPoint(POINT p, uint f);
            [DllImport("shcore.dll")] public static extern int GetDpiForMonitor(IntPtr m, int t, out uint x, out uint y);
            [DllImport("user32.dll")] public static extern int GetSystemMetrics(int i);
            [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X; public int Y; }
            public static string Lesen() {
              SetProcessDpiAwarenessContext(new IntPtr(-4));
              var m = MonitorFromPoint(new POINT(), 1);
              uint x, y; GetDpiForMonitor(m, 0, out x, out y);
              int rel = 0; SystemParametersInfo(0x009E, 0, ref rel, 0);
              return "DPI " + x + " (" + (x * 100 / 96) + " %), relativ " + rel + ", Bildschirm " + GetSystemMetrics(0) + "x" + GetSystemMetrics(1);
            }
          }
          '@
          $datei = Join-Path $env:RUNNER_TEMP 'anz.ps1'
          Set-Content $datei ("Add-Type -TypeDefinition @'`n" + $code + "`n'@`n[Anz]::Lesen()")
          Write-Host "Vorher: $(pwsh -NoProfile -File $datei)"
          Get-CimInstance Win32_VideoController | Format-List Name,CurrentHorizontalResolution,CurrentVerticalResolution,VideoModeDescription
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; Write-Host "Set-DisplayResolution: ok" } catch { Write-Host "Set-DisplayResolution: $($_.Exception.Message)" }
          Write-Host "Nach Aufloesung: $(pwsh -NoProfile -File $datei)"
          Add-Type -TypeDefinition $code
          foreach ($rel in 1, 2, 3) {
            $ok = [Anz]::Spi(0x009F, $rel, [IntPtr]::Zero, 1)
            Start-Sleep -Seconds 2
            Write-Host "Skalierung relativ $rel gesetzt: $ok -> $(pwsh -NoProfile -File $datei)"
          }
